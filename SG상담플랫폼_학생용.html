        <input id="xsubManualTitle" placeholder="탐구 주제를 입력하세요" style="margin:6px 0 10px">
        <label style="font-size:12px;color:#666;font-weight:700">간단한 설명 <span style="color:#aaa;font-weight:400">(선택)</span></label>
        <textarea id="xsubManualDesc" rows="3" style="margin:6px 0 10px"></textarea>
        <button onclick="xsubSetManualTopic()" style="width:100%;padding:12px;background:#3b5bdb;color:#fff;border:none;border-radius:10px;font-weight:800">주제 확정</button>
      `}
    </div>` : `
    <div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-size:12px;color:#888">${t.topicSource==='ai'?'🤖 AI추천':(t.topicSource==='existing'?'📋 기존 목록에서 선택':'✍️ 직접입력')} · 희망학과: ${t.department||''}</div>
      <div style="font-weight:800;font-size:15px;margin-top:4px">${t.topicTitle}</div>
      <div style="font-size:12px;color:#666;margin-top:6px">${t.topicDesc||''}</div>
      ${!(t.report&&t.report.savedAt) ? `<button onclick="xsubResetTopic()" style="margin-top:10px;background:none;border:none;color:#3b5bdb;font-size:12px;font-weight:700">주제 다시 선택</button>` : ''}
    </div>

    ${renderXsubReasonBlock(t)}

    <div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:800;font-size:14px">📄 교과활동 보고서</span>
        ${(t.report&&t.report.savedAt) ? `<button onclick="xsubPrintReport()" style="padding:7px 14px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px">🖨 인쇄/PDF</button>` : ''}
      </div>
      <div style="font-size:11px;color:#888;margin-bottom:10px">항목별로 "🤖 AI로 생성" 버튼을 눌러 내용을 만들고, 필요하면 직접 내용을 고치거나 덧붙이세요.</div>
      ${XSUB_REPORT_FIELDS.map(function(pair){
        const f=pair[0], label=pair[1];
        const val = (t.report && t.report[f]) || '';
        const loading = !!_xsubReportLoading[f];
        const btnColor = XSUB_REPORT_FIELD_COLORS[f]||'#0f766e';
        return `
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid #f1f1f1">
          <label style="font-size:12px;color:#333;font-weight:800">${label} <span style="color:#e03131;font-weight:400">(필수)</span></label>
          <button onclick="xsubGenerateReportSection('${f}')" ${loading?'disabled':''} style="width:100%;padding:12px;background:${btnColor};color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:8px">${loading?'⏳ 생성 중...':(val?('🔄 '+label+' 다시 생성'):('🤖 '+label+' (필수)'))}</button>
          <textarea id="xsubReport_${f}" rows="3" placeholder="AI로 생성하거나 직접 입력하세요" style="margin-top:8px;font-size:13px">${String(val).replace(/</g,'&lt;')}</textarea>
        </div>`;
      }).join('')}
      <button onclick="xsubSaveActivity()" style="width:100%;padding:12px;background:#3b5bdb;color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:8px">💾 보고서 저장</button>
    </div>

    ${(t.report&&t.report.savedAt) ? `
    <div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:30px">
      <div style="font-weight:800;font-size:14px;margin-bottom:10px">📝 교과 예상세특 (500자)</div>
      ${t.expectedRecord && t.expectedRecord.recordText ? `<div style="background:#fff7ed;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;margin-bottom:10px">${String(t.expectedRecord.recordText).replace(/</g,'&lt;')}</div>` : '<div style="text-align:center;color:#aaa;font-size:12px;padding:16px">아직 생성되지 않았습니다.</div>'}
      <button onclick="xsubGenerateRecord()" ${_xsubRecordLoading?'disabled':''} style="width:100%;padding:12px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-weight:800">${_xsubRecordLoading?'⏳ 생성 중...':(t.expectedRecord?'🔄 예상세특 다시 생성':'🤖 교과 예상세특 생성')}</button>
    </div>` : ''}
    `}
  </div>
  ${xactPickerHtml()}`;
}

// ══════════════════════════════════════════════════════════════════════════
// 🏆 X-lab — 최종예상세특 (학생용, 2026-09-28 신규)
// 관리자 요청 스펙: 교과목+희망학과 선택 → 기존 월별주제활동(xlabTopics) 또는
// 월별교과활동(xlabSubjectReports)에서 같은 교과목으로 작성된 보고서를 불러와 선택(또는
// 불러오지 않고 직접 입력) → 6개 항목(주제선정동기/개념·원리·이론/실사례/문제점·개선점/
// 배운점·느낀점·알게된점/독서활동) 각각을 AI추천/직접입력/수정·추가/없음 중 선택 →
// 연계활동(유형 선택 후 AI추천/직접입력) 추가 → "최종 예상세특 생성"(500자) → 저장/수정/
// 인쇄·PDF. 저장 위치: 신규 컬렉션 xlabFinalRecords.
// ⚠️ Firestore 보안규칙에 'xlabFinalRecords' 컬렉션이 xlabTopics와 같은 방식으로
// (allow read, write: if true) 추가되어 있어야 정상 동작합니다.
// ══════════════════════════════════════════════════════════════════════════
const XFIN_SECTIONS = [
  ['motivation','주제 선정동기'],
  ['concept','개념·원리·이론'],
  ['example','실사례'],
  ['issue','문제점·개선점'],
  ['learned','배운점·느낀점·알게된점'],
  ['reading','독서활동'],
];
const XFIN_SECTION_COLORS = {motivation:'#e08a8a', concept:'#5fae7a', example:'#d99a4e', issue:'#d9738c', learned:'#6c8ee2', reading:'#8f7fe0'};
const XFIN_LINKED_TYPES = ['동아리','진로','자율','봉사','교과','실험','탐구','토론','강연','독서','논문','직접입력'];

let _xfinList = [];
let _xfinLoading = false;
let _xfinLoaded = false;
let _xfinView = 'list';
let _xfinCurrent = null;
let _xfinCandidates = null; // null=아직 미조회, []=조회했지만 없음
let _xfinCandidatesLoading = false;
let _xfinSectionLoading = {};
let _xfinLinkedLoading = false;
let _xfinFinalLoading = false;

async function _xfinLoadList(){
  if(!FB() || !CU) return;
  _xfinLoading = true; render();
  try{
    const all = await window._fb.getWhere('xlabFinalRecords','studentId','==',String(CU.id));
    _xfinList = (all||[]).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  }catch(e){
    console.warn('X-lab 최종예상세특 목록 로딩 실패:', e.message);
    _xfinList = [];
  }
  _xfinLoaded = true;
  _xfinLoading = false; render();
}

function _xfinBlankSections(){
  const o = {};
  XFIN_SECTIONS.forEach(function(pair){ o[pair[0]] = {mode:'', text:''}; });
  return o;
}

function xfinNewRecord(){
  _xfinCurrent = {
    id: 'xfin_'+CU.id+'_'+Date.now(),
    studentId: String(CU.id),
    studentName: CU.name||'', studentSchool: CU.school||'', studentGrade: CU.grade||'',
    department: CU.xlabDepartment||'',
    subjectArea:'', subjectAreaCustom:'',
    topicTitle:'',
    sourceType:'', sourceId:'',
    sections: _xfinBlankSections(),
    linkedActivity: {types:[], typeCustom:'', mode:'', text:''},
    finalRecordText:'',
    createdAt: Date.now(),
  };
  _xfinCandidates = null;
  _xfinView = 'edit';
  render();
}

function xfinOpenExisting(id){
  const t = _xfinList.find(function(x){return x.id===id;});
  if(!t) return;
  _xfinCurrent = t;
  if(!_xfinCurrent.sections) _xfinCurrent.sections = _xfinBlankSections();
  if(!_xfinCurrent.linkedActivity) _xfinCurrent.linkedActivity = {types:[], typeCustom:'', mode:'', text:''};
  // ★ 2026-09-29 수정: 연계활동을 중복 선택 가능하게 바꾸면서 단일값 "type"을
  // 배열 "types"로 변경 — 이전에 저장된 단일 선택 기록도 배열로 옮겨서 계속 보이게 함.
  if(!Array.isArray(_xfinCurrent.linkedActivity.types)){
    _xfinCurrent.linkedActivity.types = _xfinCurrent.linkedActivity.type ? [_xfinCurrent.linkedActivity.type] : [];
  }
  _xfinCandidates = null;
  _xfinView = 'edit';
  render();
}

function xfinBackToList(){ _xfinView='list'; _xfinCurrent=null; render(); }

function xfinCaptureFormFields(){
  if(!_xfinCurrent) return;
  const deptEl=document.getElementById('xfinDeptInput'); if(deptEl) _xfinCurrent.department=deptEl.value;
  const customEl=document.getElementById('xfinSubjectAreaCustom'); if(customEl) _xfinCurrent.subjectAreaCustom=customEl.value;
  const topicEl=document.getElementById('xfinTopicTitleInput'); if(topicEl) _xfinCurrent.topicTitle=topicEl.value;
  if(!_xfinCurrent.sections) _xfinCurrent.sections=_xfinBlankSections();
  XFIN_SECTIONS.forEach(function(pair){
    const el=document.getElementById('xfinSection_'+pair[0]);
    if(el){ if(!_xfinCurrent.sections[pair[0]]) _xfinCurrent.sections[pair[0]]={mode:'',text:''}; _xfinCurrent.sections[pair[0]].text=el.value; }
  });
  if(!_xfinCurrent.linkedActivity) _xfinCurrent.linkedActivity={types:[],typeCustom:'',mode:'',text:''};
  const linkedCustomEl=document.getElementById('xfinLinkedTypeCustom'); if(linkedCustomEl) _xfinCurrent.linkedActivity.typeCustom=linkedCustomEl.value;
  const linkedContentEl=document.getElementById('xfinLinkedContent'); if(linkedContentEl) _xfinCurrent.linkedActivity.text=linkedContentEl.value;
  const finalEl=document.getElementById('xfinFinalRecordText'); if(finalEl) _xfinCurrent.finalRecordText=finalEl.value;
}

function _xfinResolvedSubjectArea(t){
  if(!t) return '';
  return (t.subjectArea==='직접입력') ? (t.subjectAreaCustom||'').trim() : (t.subjectArea||'');
}
// ★ 2026-09-29 수정: 연계활동 유형을 여러 개 중복 선택할 수 있게 되어, 선택된 유형들을
// 쉼표로 이어붙인 문자열로 반환한다("직접입력"은 사용자가 입력한 커스텀 텍스트로 치환).
function _xfinResolvedLinkedType(t){
  const la = (t && t.linkedActivity) || {};
  const types = Array.isArray(la.types) ? la.types : (la.type ? [la.type] : []);
  return types.map(function(v){ return v==='직접입력' ? (la.typeCustom||'').trim() : v; }).filter(Boolean).join(', ');
}

function xfinChooseSubjectArea(v){
  if(_xfinCurrent.finalRecordText) return; // 최종 생성 후에는 일관성 보호를 위해 교과목 변경 불가
  xfinCaptureFormFields();
  _xfinCurrent.subjectArea = v;
  if(v!=='직접입력') _xfinCurrent.subjectAreaCustom='';
  _xfinCandidates = null;
  render();
}

async function xfinLoadCandidates(){
  xfinCaptureFormFields();
  const subjArea = _xfinResolvedSubjectArea(_xfinCurrent);
  if(!subjArea){ alert('교과목을 먼저 선택해주세요.'); return; }
  _xfinCandidatesLoading = true; render();
  try{
    const [topics, subjects] = await Promise.all([
      window._fb.getWhere('xlabTopics','studentId','==',String(CU.id)),
      window._fb.getWhere('xlabSubjectReports','studentId','==',String(CU.id)),
    ]);
    const list = [];
    (topics||[]).forEach(function(x){
      if(!x.topicTitle) return;
      if((x.subjectArea||'').trim()!==subjArea) return;
      list.push({
        kind:'topic', id:x.id, month:x.month, department:x.department,
        topicTitle:x.topicTitle, topicDesc:x.topicDesc||'',
        advancedTopicTitle:x.advancedTopicTitle||'',
        expectedRecordText:(x.expectedRecord&&x.expectedRecord.recordText)||'',
        base:{
          motivation:(x.report&&x.report.reason)||'',
          concept:(x.report&&x.report.concept)||'',
          example:(x.report&&x.report.example)||'',
          issue:(x.report&&x.report.issue)||'',
          learned:'', reading:'',
        },
      });
    });
    (subjects||[]).forEach(function(x){
      if(!x.topicTitle) return;
      if(_xsubResolvedSubjectArea(x)!==subjArea) return;
      list.push({
        kind:'subject', id:x.id, month:x.month, department:x.department,
        topicTitle:x.topicTitle, topicDesc:x.topicDesc||'',
        advancedTopicTitle:(x.report&&x.report.advanced)||'',
        expectedRecordText:(x.expectedRecord&&x.expectedRecord.recordText)||'',
        base:{
          motivation:_xsubReasonSummaryText(x.reason||{}),
          concept:(x.report&&x.report.concept)||'',
          example:(x.report&&x.report.example)||'',
          issue:(x.report&&x.report.issue)||'',
          learned:(x.report&&x.report.learned)||'',
          reading:(x.report&&x.report.reading)||'',
        },
      });
    });
    list.sort(function(a,b){ return String(b.month).localeCompare(String(a.month)); });
    _xfinCandidates = list;
  }catch(e){
    alert('불러오기 실패: '+e.message);
    _xfinCandidates = [];
  }
  _xfinCandidatesLoading = false; render();
}

function xfinSelectCandidate(kind, id){
  const c = (_xfinCandidates||[]).find(function(x){return x.kind===kind && x.id===id;});
  if(!c) return;
  xfinCaptureFormFields();
  _xfinCurrent.sourceType = kind;
  _xfinCurrent.sourceId = id;
  _xfinCurrent.topicTitle = c.topicTitle || '';
  if(!_xfinCurrent.department) _xfinCurrent.department = c.department||CU.xlabDepartment||'';
  XFIN_SECTIONS.forEach(function(pair){
    const k = pair[0];
    const baseVal = (c.base && c.base[k]) || '';
    _xfinCurrent.sections[k] = { mode: baseVal ? 'edit' : '', text: baseVal };
  });
  render();
}

function xfinStartManual(){
  xfinCaptureFormFields();
  _xfinCurrent.sourceType = 'manual';
  _xfinCurrent.sourceId = '';
  render();
}

function xfinChooseSectionMode(field, mode){
  xfinCaptureFormFields();
  if(!_xfinCurrent.sections[field]) _xfinCurrent.sections[field] = {mode:'', text:''};
  _xfinCurrent.sections[field].mode = mode;
  if(mode==='none') _xfinCurrent.sections[field].text = '';
  render();
}

async function xfinGenerateSection(field){
  xfinCaptureFormFields();
  const subjArea = _xfinResolvedSubjectArea(_xfinCurrent);
  if(!subjArea || !_xfinCurrent.topicTitle){ alert('교과목과 주제/활동명을 먼저 입력해주세요.'); return; }
  const baseContext = (_xfinCurrent.sections[field] && _xfinCurrent.sections[field].text) || '';
  _xfinSectionLoading[field] = true; render();
  try{
    const r = await window._fb.xlabGenerateFinalSection({department:_xfinCurrent.department||'', subjectArea:subjArea, topic:_xfinCurrent.topicTitle, section:field, baseContext:baseContext, grade:CU.grade||''});
    if(!_xfinCurrent.sections[field]) _xfinCurrent.sections[field] = {mode:'ai', text:''};
    _xfinCurrent.sections[field].text = r.text;
  }catch(e){
    alert('생성 중 오류가 발생했습니다: '+e.message);
  }
  _xfinSectionLoading[field] = false; render();
}

function renderXfinSectionBlock(t, key, label){
  const sec = t.sections[key] || {mode:'', text:''};
  const loading = !!_xfinSectionLoading[key];
  const color = XFIN_SECTION_COLORS[key] || '#0f766e';
  const modes = [['ai','🤖 AI추천'],['manual','✍️ 직접입력'],['edit','📝 수정/추가'],['none','🚫 없음']];
  let control = '';
  if(sec.mode==='none'){
    control = '<div style="text-align:center;color:#aaa;font-size:11px;padding:10px">이 항목은 최종 예상세특에 포함하지 않습니다.</div>';
  }else if(sec.mode==='ai'){
    control = `<button onclick="xfinGenerateSection('${key}')" ${loading?'disabled':''} style="width:100%;padding:10px;background:${color};color:#fff;border:none;border-radius:8px;font-weight:800;margin-bottom:6px">${loading?'⏳ 생성 중...':(sec.text?'🔄 다시 생성':'AI로 생성')}</button>
      <textarea id="xfinSection_${key}" rows="3" placeholder="AI로 생성된 내용이 여기에 표시됩니다" style="font-size:13px">${String(sec.text||'').replace(/</g,'&lt;')}</textarea>`;
  }else if(sec.mode==='manual' || sec.mode==='edit'){
    control = `<textarea id="xfinSection_${key}" rows="3" placeholder="${sec.mode==='edit'?'기존 내용을 수정·추가하세요':'내용을 직접 입력하세요'}" style="font-size:13px">${String(sec.text||'').replace(/</g,'&lt;')}</textarea>`;
  }else{
    control = '<div style="text-align:center;color:#aaa;font-size:11px;padding:10px">위에서 방법을 선택해주세요.</div>';
  }
  return `
  <div style="margin-top:16px;padding-top:14px;border-top:1px solid #f1f1f1">
    <div style="font-size:12px;font-weight:800;color:#333;margin-bottom:6px">${label}</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">
      ${modes.map(function(pair){
        const mk=pair[0], mlabel=pair[1];
        const on = sec.mode===mk;
        return `<button onclick="xfinChooseSectionMode('${key}','${mk}')" style="padding:5px 10px;border-radius:14px;border:1.5px solid ${on?color:'#ddd'};background:${on?color:'#fff'};color:${on?'#fff':'#333'};font-weight:700;font-size:10.5px">${mlabel}</button>`;
      }).join('')}
    </div>
    ${control}
  </div>`;
}

// ★ 2026-09-29 수정(관리자 요청: "연계활동은 중복 선택도 가능해도 될것 같습니다"):
// 단일 선택 토글에서 다중 선택 토글로 변경 — 클릭할 때마다 배열에 추가/제거한다.
function xfinChooseLinkedType(v){
  xfinCaptureFormFields();
  if(!_xfinCurrent.linkedActivity) _xfinCurrent.linkedActivity = {types:[], typeCustom:'', mode:'', text:''};
  if(!Array.isArray(_xfinCurrent.linkedActivity.types)) _xfinCurrent.linkedActivity.types = [];
  const idx = _xfinCurrent.linkedActivity.types.indexOf(v);
  if(idx===-1) _xfinCurrent.linkedActivity.types.push(v);
  else _xfinCurrent.linkedActivity.types.splice(idx,1);
  if(_xfinCurrent.linkedActivity.types.indexOf('직접입력')===-1) _xfinCurrent.linkedActivity.typeCustom = '';
  render();
}

function xfinChooseLinkedMode(mode){
  xfinCaptureFormFields();
  if(!_xfinCurrent.linkedActivity) _xfinCurrent.linkedActivity = {types:[], typeCustom:'', mode:'', text:''};
  _xfinCurrent.linkedActivity.mode = mode;
  if(mode==='none') _xfinCurrent.linkedActivity.text = '';
  render();
}

async function xfinGenerateLinkedActivity(){
  xfinCaptureFormFields();
  const activityType = _xfinResolvedLinkedType(_xfinCurrent);
  const subjArea = _xfinResolvedSubjectArea(_xfinCurrent);
  if(!activityType){ alert('연계활동 유형을 먼저 선택해주세요.'); return; }
  if(!subjArea || !_xfinCurrent.topicTitle){ alert('교과목과 주제/활동명을 먼저 입력해주세요.'); return; }
  _xfinLinkedLoading = true; render();
  try{
    const r = await window._fb.xlabGenerateFinalLinkedActivity({department:_xfinCurrent.department||'', subjectArea:subjArea, topic:_xfinCurrent.topicTitle, activityType:activityType, grade:CU.grade||''});
    _xfinCurrent.linkedActivity.text = r.text;
  }catch(e){
    alert('생성 중 오류가 발생했습니다: '+e.message);
  }
  _xfinLinkedLoading = false; render();
}

async function xfinGenerateFinalRecord(){
  xfinCaptureFormFields();
  const subjArea = _xfinResolvedSubjectArea(_xfinCurrent);
  if(!subjArea){ alert('교과목을 선택해주세요.'); return; }
  if(!_xfinCurrent.topicTitle){ alert('주제/활동명을 입력해주세요.'); return; }
  const sectionTexts = {};
  XFIN_SECTIONS.forEach(function(pair){
    const k = pair[0];
    const sec = _xfinCurrent.sections[k];
    if(sec && sec.mode!=='none' && sec.text) sectionTexts[k] = sec.text;
  });
  const la = _xfinCurrent.linkedActivity || {};
  const linkedText = (la.mode!=='none') ? (la.text||'') : '';
  _xfinFinalLoading = true; render();
  try{
    const r = await window._fb.xlabGenerateFinalRecord({department:_xfinCurrent.department||'', subjectArea:subjArea, topic:_xfinCurrent.topicTitle, sectionTexts:sectionTexts, linkedActivityText:linkedText, grade:CU.grade||''});
    _xfinCurrent.finalRecordText = r.recordText;
  }catch(e){
    alert('생성 중 오류가 발생했습니다: '+e.message);
  }
  _xfinFinalLoading = false; render();
}

async function xfinSaveRecord(){
  xfinCaptureFormFields();
  const subjArea = _xfinResolvedSubjectArea(_xfinCurrent);
  if(!subjArea){ alert('교과목을 선택해주세요.'); return; }
  if(!_xfinCurrent.topicTitle){ alert('주제/활동명을 입력해주세요.'); return; }
  if(!_xfinCurrent.finalRecordText){ alert('먼저 "최종 예상세특 생성"을 눌러주세요.'); return; }
  _xfinCurrent.studentName = CU.name||'';
  _xfinCurrent.studentSchool = CU.school||'';
  _xfinCurrent.studentGrade = CU.grade||'';
  _xfinCurrent.savedAt = Date.now();
  try{
    if(FB()) await window._fb.set('xlabFinalRecords', _xfinCurrent.id, _xfinCurrent);
    toast('저장되었습니다 💾');
    await _xfinLoadList();
    _xfinView='list'; _xfinCurrent=null; render();
  }catch(e){ alert('저장 실패: '+e.message); }
}

function xfinDeleteRecord(id){
  if(!confirm('이 최종예상세특을 삭제하시겠습니까?')) return;
  (async function(){
    try{
      if(FB()) await window._db.collection('xlabFinalRecords').doc(id).delete();
      toast('삭제되었습니다');
      await _xfinLoadList();
    }catch(e){ alert('삭제 실패: '+e.message); }
  })();
}

function _xfinBuildFullReportHtml(t){
  const savedDate = t.savedAt ? new Date(t.savedAt) : new Date();
  const dateStr = savedDate.getFullYear()+'.'+String(savedDate.getMonth()+1).padStart(2,'0')+'.'+String(savedDate.getDate()).padStart(2,'0');
  const schoolVal = t.studentSchool || (typeof CU!=='undefined' && CU ? CU.school : '') || '';
  const gradeVal = t.studentGrade || (typeof CU!=='undefined' && CU ? CU.grade : '') || '';
  const dateCompact = savedDate.getFullYear()+String(savedDate.getMonth()+1).padStart(2,'0')+String(savedDate.getDate()).padStart(2,'0');
  const pdfTitle = (t.studentName?(_xlabEsc(t.studentName)+'_'):'')+'X-lab 최종예상세특_'+dateCompact;
  const subjArea = _xfinResolvedSubjectArea(t);
  const sectionLabels = {motivation:'주제 선정동기',concept:'개념·원리·이론',example:'실사례',issue:'문제점·개선점',learned:'배운점·느낀점·알게된점',reading:'독서활동'};
  let html = '<html><head><meta charset="utf-8"><title>'+pdfTitle+'</title>'
    +'<style>body{font-family:"Malgun Gothic",sans-serif;padding:36px;color:#222;line-height:1.7}h1{font-size:22px;text-align:center;margin-bottom:14px}h2{font-size:15px;margin:20px 0 6px;color:#b8860b}hr{border:none;border-top:1px solid #ccc;margin:14px 0}.meta-row{display:flex;flex-wrap:wrap;gap:18px;font-size:13px}.topic-box{background:#f7f8fb;border-radius:10px;padding:12px 14px;font-size:13px}.record-box{background:#fffbe6;border-radius:10px;padding:14px;font-size:14px;white-space:pre-wrap;border:1.5px solid #f0d060}p{font-size:13px;white-space:pre-wrap}</style></head><body>'
    +'<h1>🏆 X-lab 최종예상세특</h1>'
    +'<hr>'
    +'<div class="meta-row">'
      +'<span>년월일: <b>'+dateStr+'</b></span>'
      +'<span>학교: <b>'+_xlabEsc(schoolVal)+'</b></span>'
      +'<span>학년: <b>'+_xlabEsc(gradeVal)+'</b></span>'
      +'<span>이름: <b>'+_xlabEsc(t.studentName)+'</b></span>'
      +'<span>희망학과: <b>'+_xlabEsc(t.department)+'</b></span>'
    +'</div>'
    +'<hr>'
    +'<div class="topic-box">'
      +'<div><b>교과목:</b> '+_xlabEsc(subjArea||'-')+'</div>'
      +'<div><b>주제/활동명:</b> '+_xlabEsc(t.topicTitle)+'</div>'
    +'</div>'
    +'<hr>'
    +'<h2>📋 최종 예상세특</h2>'
    +'<div class="record-box">'+_xlabEsc(t.finalRecordText)+'</div>';
  Object.keys(sectionLabels).forEach(function(k){
    const sec = t.sections && t.sections[k];
    if(sec && sec.mode!=='none' && sec.text){
      html += '<h2>'+sectionLabels[k]+'</h2><p>'+_xlabEsc(sec.text)+'</p>';
    }
  });
  const laText = (t.linkedActivity && t.linkedActivity.mode!=='none') ? t.linkedActivity.text : '';
  if(laText){
    html += '<h2>연계 활동 ('+_xlabEsc(_xfinResolvedLinkedType(t))+')</h2><p>'+_xlabEsc(laText)+'</p>';
  }
  html += '<script>window.onload=function(){setTimeout(function(){window.print();},500);};<\/script></body></html>';
  return html;
}

function xfinPrintReport(){
  const t = _xfinCurrent;
  if(!t) return;
  const w = window.open('','_blank');
  w.document.write(_xfinBuildFullReportHtml(t));
  w.document.close();
}

function getPressureValue(id){
    const x=document.querySelector(`.pressure-val[data-pid="${id}"]`);
    return x ? Number(x.value) : 7;
}
function avgPressure(ids){return ids.reduce((a,id)=>a+getPressureValue(id),0)/ids.length}
function calcPressureProfile(){
    const expect=avgPressure(['P1','P2']);
    const ownership=getPressureValue('P3');
    const help=getPressureValue('P4');
    const accumulation=avgPressure(['P5','P6']);
    const release=getPressureValue('P7');
    const reentry=(11-getPressureValue('P8')+getPressureValue('P9')+11-getPressureValue('P10'))/3;
    const errorTol=(11-getPressureValue('P11')+getPressureValue('P12'))/2;
    const pressureControl=(11-expect+ownership)/2;
    const recoveryHelp=(help+release)/2;
    const returnTolerance=(reentry+errorTol)/2;
    return {expect,ownership,help,accumulation,release,reentry,errorTol,pressureControl,recoveryHelp,returnTolerance};
}
function pressureLevel(x){return x>=8?'안정':x>=6?'보통':'확인 필요'}
function pressureSignals(p){
    const r=[];
    if(p.expect>=8 &amp;&amp; p.ownership&lt;7) r.push(['기대 부담','주변 기대가 자기 목표보다 크게 느껴지는지 상담에서 확인이 필요합니다.']);
    if(p.accumulation>=8 &amp;&amp; p.help&lt;6) r.push(['혼자 참고 버티는 경향','겉으로는 잘 버텨 보여도 힘든 상황을 알리는 시점이 늦을 수 있습니다.']);
    if(p.reentry&lt;6) r.push(['학습 복귀가 늦음','한 번 흐름이 끊기면 다시 시작하는 데 시간이 걸릴 수 있습니다.']);
    if(p.errorTol&lt;6) r.push(['작은 실수에 크게 흔들림','작은 실수나 계획 변경이 이후 공부 전체에 번지는지 확인이 필요합니다.']);
    if(p.release&lt;6) r.push(['스트레스 해소 방법 점검','쉬는 시간을 없애기보다 실제로 회복에 도움이 되는 방법을 찾아야 합니다.']);
    return r;
}

function renderGradeSelects() {
    const subjects = [
        {id: "kor", name: "국어"}, {id: "eng", name: "영어"}, {id: "mat", name: "수학"}, 
        {id: "sci", name: "과학"}, {id: "soc", name: "사회"}, {id: "his", name: "역사"}
    ];
    const sems = ["21", "22", "31", "32"];
    const grade = document.getElementById('inGrade').value;
    let html = "";
    subjects.forEach(subj => {
        html += `&lt;tr>&lt;td style="font-weight:bold; color:var(--primary); background:#f0f4f8;">${subj.name}&lt;/td>`;
        sems.forEach(sem => {
            html += `&lt;td>&lt;select id="g-${subj.id}-${sem}">
                        &lt;option value="" selected>미이수 / 아직 성적 없음&lt;/option>
                        &lt;option value="90">A&lt;/option>
                        &lt;option value="70">B&lt;/option>
                        &lt;option value="50">C&lt;/option>
                        &lt;option value="30">D/E&lt;/option>
                     &lt;/select>&lt;/td>`;
        });
        html += `&lt;/tr>`;
    });
    document.getElementById('gradeTbody').innerHTML = html;

    // 학년별 안내: 아직 해당 학기 성적이 없으면 그대로 '미이수' 유지
    const guide = document.getElementById('gradeDataGuide');
    if(guide){
        if(grade === 'elem'){
            guide.innerHTML = '초5~6은 학기별 A/B 성취도 분석을 사용하지 않습니다. 아래 &lt;b>현재 교과 기반&lt;/b> 입력과 객관자료·선행·심화 자료를 활용합니다.';
        }else if(grade === 'mid12'){
            guide.innerHTML = '중1~2 학생은 &lt;b>실제로 나온 학기 성적만&lt;/b> 입력하세요. 시험 전이라 성적이 전혀 없다면 모두 미이수로 두고 아래 현재 교과 기반을 입력합니다.';
        }else{
            guide.innerHTML = '중3 학생도 &lt;b>실제로 확정된 학기 성적만&lt;/b> 입력하세요. 아직 나오지 않은 3학년 2학기 성적은 미이수로 둡니다.';
        }
    }
}

function renderApexRadar(values){
    const host=document.getElementById('radarChartSvg');
    if(!host) return;
    const vals=(values||[]).map(v=>Math.max(0,Math.min(100,Number(v)||0)));
    const labels=['탐구','자기주도','정서','학습습관'];
    const cx=160, cy=155, maxR=105;
    const dirs=[
      [0,-1],[1,0],[0,1],[-1,0]
    ];
    const pt=(r,i)=>[cx+dirs[i][0]*r,cy+dirs[i][1]*r];
    const grid=[25,50,75,100].map(level=>{
      const p=dirs.map((_,i)=>pt(maxR*level/100,i).join(',')).join(' ');
      return `&lt;polygon points="${p}" fill="none" stroke="${level===100?'#b8c4d6':'#dfe6ef'}" stroke-width="${level===100?1.5:1}"/>`;
    }).join('');
    const axes=dirs.map((_,i)=>{
      const p=pt(maxR,i);
      return `&lt;line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#d7dee9" stroke-width="1"/>`;
    }).join('');
    const dataPts=vals.map((v,i)=>pt(maxR*v/100,i));
    const poly=dataPts.map(p=>p.join(',')).join(' ');

      [cx,24,'middle'],[294,cy+5,'start'],[cx,302,'middle'],[26,cy+5,'end']
    ];

}

function getDnaStage(totalRaw){
    const stages=[
      {min:231,max:240,label:'최상위 균형형',code:'M'},
      {min:221,max:230,label:'심화 탐구형',code:'A+'},
      {min:211,max:220,label:'자기주도 안정형',code:'A'},
      {min:201,max:210,label:'안정 성장형',code:'B+'},
      {min:191,max:200,label:'기본기 확보형',code:'B'},
      {min:181,max:190,label:'성장 변동형',code:'C+'},
      {min:171,max:180,label:'실행 보완형',code:'C'},
      {min:0,max:170,label:'기초 구조 보완형',code:'D'}
    ];
    return stages.find(s=>totalRaw>=s.min&amp;&amp;totalRaw&lt;=s.max)||stages[stages.length-1];
}

function gradeLabel(v){
    if(!Number.isFinite(v)) return '자료 없음';
    if(v>=85) return 'A';
    if(v>=65) return 'B';
    if(v>=45) return 'C';
    return 'D/E';
}

function subjectAchievementProfile(values){
    const actual=(values||[]).filter(Number.isFinite);
    if(!actual.length) return {label:'자료 없음', detail:'', trend:'', title:'자료 없음'};
    const letters=actual.map(achievementLetter);
    const c=countLetters(actual);
    const ratioA=c.total ? c.A/c.total : 0;
    const ratioB=c.total ? c.B/c.total : 0;

    let label='성취 혼합';
    if(c.A===c.total) label='A 안정';
    else if(ratioA>=0.7) label='A 안정';
    else if(c.A>c.B &amp;&amp; c.A>=c.C+c['D/E']) label='A 우세';
    else if(c.A===c.B &amp;&amp; c.A>0) label='A/B 혼합';
    else if(c.B>c.A &amp;&amp; c.B>=c.C+c['D/E']) label='B 우세';
    else if((c.C+c['D/E'])>0 &amp;&amp; (c.C+c['D/E'])>=Math.max(c.A,c.B)) label='과목 성취 보완';

    let trend='추이 판단 자료 부족';
    if(letters.length>=2){
      const first=actual[0], last=actual[actual.length-1];
      const diff=last-first;
      if(diff>=15) trend='최근 상승';
      else if(diff&lt;=-15) trend='최근 하락';
      else trend='대체로 유지';
    }
    const detail=letters.join(' → ');
    return {label,detail,trend,title:`${label}${detail?` · ${detail}`:''}`};
}
function scoreLabel(v){
    if(!Number.isFinite(v)) return '자료 없음';
    if(v>=90) return '최상위';
    if(v>=80) return '상위';
    if(v>=65) return '중상';
    if(v>=50) return '기초';
    return '보완';
}
function subjectReadiness(gradeV,mockV,advanceV){
    const pairs = [[gradeV,0.45],[mockV,0.25],[advanceV,0.30]];
    let s=0,w=0;
    pairs.forEach(([v,wt])=>{ if(Number.isFinite(v)){ s+=v*wt; w+=wt; }});
    return w ? s/w : null;
}


function achievementLetter(v){
    if(!Number.isFinite(v)) return null;
    if(v>=90) return 'A';
    if(v>=70) return 'B';
    if(v>=50) return 'C';
    return 'D/E';
}
function countLetters(values){
    const c={A:0,B:0,C:0,'D/E':0,total:0};
    values.forEach(v=>{
      const l=achievementLetter(v);
      if(l){ c[l]++; c.total++; }
    });
    return c;
}
function pct(n,d){ return d ? (n/d*100) : null; }

        evidenceList:evidenceNames([

        next:'긴 글 독해, 자기 생각 표현, 사회·시사 주제에 대한 질문과 토론 경험을 확인'

        signal:weightedOptional([
          [weightedOptional([[baseKor,1],[baseMath,1],[baseEng,1],[baseSci,1]]),0.40],

        ]),
        evidence:evidenceCount(
          weightedOptional([[baseKor,1],[baseMath,1],[baseEng,1],[baseSci,1]]),

          advGeneral
        ),
        evidenceList:evidenceNames([
          ['국·수·영·과 현재 기반',weightedOptional([[baseKor,1],[baseMath,1],[baseEng,1],[baseSci,1]])],
          ['객관 문제해결 자료',meanNonNull([mockKor,mockMath,mockEng,mockSci])],

        ]),
        next:'특정 진학 방향을 서두르기보다 1~2년간 어떤 강점이 반복되는지 확인'
      }
    ];

    const renderDirectionCards = (directions, middle=false) => {
      const sorted=[...directions].sort((a,b)=>(b.signal??-1)-(a.signal??-1));
      const topKey=sorted[0]?.key;
      const secondKey=sorted[1]?.key;

      return directions.map(d=>{
        let label, color, text;
        const enough=d.evidence>=2;
        const minimal=d.evidence>=1;

        if(!minimal){
          label=middle?'판단 유보':'아직 판단 유보';
          color='#777';
          text='현재 학업·객관·심화 자료가 충분하지 않아 방향을 정하지 않습니다. 경험과 실제 수행 자료를 먼저 확보합니다.';
        }else if(d.key===topKey &amp;&amp; enough &amp;&amp; Number.isFinite(d.signal) &amp;&amp; d.signal>=76){
          label=middle?'우선 검토':'탐색 우선';
          color='#2e7d32';
          text=middle
            ? '현재 확보된 자료에서 이 방향의 신호가 가장 일관되게 나타납니다. 실제 학교 성적과 활동 자료가 추가되면 구체적인 학교 검토로 넘어갑니다.'

        }else if((d.key===topKey || d.key===secondKey) &amp;&amp; enough &amp;&amp; Number.isFinite(d.signal) &amp;&amp; d.signal>=66){
          label='가능성 확인';
          color='#1565c0';
          text='관련 신호가 보이지만 한 방향으로 확정할 단계는 아닙니다. 실제 수행 장면과 추가 객관자료로 반복 여부를 확인합니다.';
        }else if(enough){
          label=middle?'자료 더 확인':'경험 더 필요';
          color='#8a6d1f';
          text='일부 관련 자료는 있으나 현재 강점이 반복적으로 확인되지는 않았습니다. 다음 경험에서 반응을 더 관찰합니다.';
        }else{
          label=middle?'자료 더 필요':'경험 더 필요';
          color='#8a6d1f';
          text='한 종류의 자료만으로는 방향을 판단하지 않습니다. 다른 형태의 실제 경험이나 객관자료를 추가합니다.';
        }

        const ev=d.evidenceList.length ? d.evidenceList.join(' · ') : '추가 자료 필요';
        return `&lt;div class="school-card" style="text-align:left;border-left:5px solid ${color};">

          &lt;div style="font-weight:900;color:#222;font-size:1.08em;margin-top:5px;">${d.name}&lt;/div>
          &lt;div style="font-size:0.76em;color:#777;margin-top:2px;">${d.examples}&lt;/div>
          &lt;div style="font-size:0.80em;color:#555;line-height:1.5;margin-top:8px;">${text}&lt;/div>
          &lt;div style="margin-top:8px;padding-top:7px;border-top:1px solid #eee;font-size:0.74em;line-height:1.5;color:#666;">
            &lt;b>현재 확인된 근거 ${d.evidence}종&lt;/b> · ${ev}&lt;br>
            &lt;b>다음 확인&lt;/b> · ${d.next}
          &lt;/div>
        &lt;/div>`;
      }).join('');
    };

    if(isElementary){
      if(schoolPageTitle) schoolPageTitle.innerHTML='🏫 진학 환경 방향 탐색';
      if(schoolPageIntro) schoolPageIntro.innerHTML='초5~6에서는 특정 학교를 점수로 매칭하지 않습니다. &lt;b>어떤 학교 환경을 앞으로 경험해 볼 가치가 있는지&lt;/b>를 4가지 방향으로 탐색합니다. 점수가 높더라도 학업·객관·심화 자료 중 서로 다른 근거가 충분하지 않으면 상위 판정을 주지 않습니다.';
      if(schoolLegend) schoolLegend.innerHTML='탐색 우선 · 가능성 확인 · 경험 더 필요 · 아직 판단 유보';
      if(sGrid) sGrid.innerHTML=renderDirectionCards(elemDirections,false);
    }else if(isMidEarly){
      const midDirections=elemDirections.map(d=>({
        ...d,
        examples:d.key==='science' ? '향후 검토 유형: 영재학교·과학고·과학중점'
               : d.key==='intense' ? '향후 검토 유형: 자사고·자율학교·고강도 학업 환경'
               : d.key==='language' ? '향후 검토 유형: 외고·국제고·언어·국제 탐구 환경'
               : '향후 검토 유형: 우수 일반고·다양한 선택과목 환경'
      }));
      if(schoolPageTitle) schoolPageTitle.innerHTML='🏫 중1·2 진학 방향 초기 탐색';
      if(schoolPageIntro) schoolPageIntro.innerHTML='학교 시험 전이거나 실제 성적 자료가 아직 없는 중1~2는 개별 학교 점수를 표시하지 않습니다. &lt;b>현재 교과 기반·객관평가·선행·심화·APEX 성장 신호&lt;/b>를 바탕으로 학교 유형을 먼저 좁히고, 첫 학교 성적 이후 구체적인 학교 준비도로 전환합니다.';
      if(schoolLegend) schoolLegend.innerHTML='우선 검토 · 가능성 확인 · 자료 더 필요 · 판단 유보';
      if(sGrid) sGrid.innerHTML=renderDirectionCards(midDirections,true);
    }else{
      if(schoolPageTitle) schoolPageTitle.innerHTML='🏫 주요 고교 현재 준비도';
      if(schoolPageIntro) schoolPageIntro.innerHTML='실제 학교 성적이 확보된 중1~3은 &lt;b>교과 수준·객관평가·과목별 선행·심화·APEX 학업역량&lt;/b>을 함께 보고 학교별 현재 준비 상태와 보완 방향을 확인합니다. 합격 확률이 아니라 상담용 준비도입니다.';
      if(schoolLegend) schoolLegend.innerHTML='&lt;span class="gap-plus">현재 준비도 충분&lt;/span> · &lt;span style="color:#1565c0;">도전 가능·보완 필요&lt;/span> · &lt;span class="gap-minus">준비도 추가 보완 필요&lt;/span>';

      schools.forEach(s => {
        if(s.score===null || s.score===undefined){
            sGrid.innerHTML += `&lt;div class="school-card" style="border-left:5px solid #9e9e9e;">
                &lt;div style="font-weight:900;font-size:1.05em;">${s.name}&lt;/div>
                &lt;div class="status-badge" style="background:#eeeeee;color:#555;">성적 자료 추가 필요&lt;/div>
                &lt;div style="font-size:0.82em;color:#666;margin-top:8px;">현재 입력된 자료만으로는 이 학교의 정량 준비도를 계산하기 어렵습니다.&lt;/div>
            &lt;/div>`;
            return;
        }
        let sc = parseFloat(s.score);
        let tg = parseFloat(s.target.replace('점',''));
        let diff = (sc - tg).toFixed(1);

        let badge = (diff >= 2.0) ? 'stable' : (diff >= -3.0 ? 'challenge' : 'caution');
        let badgeTxt = badge === 'stable' ? '현재 준비도 충분' : (badge === 'challenge' ? '도전 가능·보완 필요' : '준비도 추가 보완 필요');
        let gapClass = diff >= 0 ? 'gap-plus' : 'gap-minus';
        let gapStr = diff > 0 ? `+${diff}` : `${diff}`;

        sGrid.innerHTML += `&lt;div class="school-card ${badge==='stable' ? 'gold' : ''}" style="text-align:left;">
            &lt;div class="status-badge badge-${badge}" style="display:inline-block;">${badgeTxt}&lt;/div>
            &lt;div style="font-weight:900; color:#222; font-size:1.05em; margin-top:5px;">${s.name}&lt;/div>
            &lt;div class="school-score" style="margin:3px 0 1px 0;">${s.score}점&lt;/div>
            &lt;div class="target-avg">권장 평균: ${s.target}&lt;/div>
            &lt;div class="gap-indicator ${gapClass}" style="margin-top:2px;">현재 준비 차이 ${gapStr}점&lt;/div>
            &lt;div style="margin-top:7px;padding-top:7px;border-top:1px solid #eee;font-size:0.76em;line-height:1.45;color:#555;">
              &lt;b style="color:#333;">반영 요소&lt;/b> · ${s.basis || "교과·객관평가·선행·APEX 역량"}
            &lt;/div>
        &lt;/div>`;
      });
    }


    // 진로·탐구·학생부 + 개인 실행전략
    const domainScores = {A:avgs.A, B:avgs.B, C:avgs.C, D:avgs.D};
    const domainLabel = {A:'탐구', B:'자기주도', C:'회복·정서', D:'학습습관'};
    const sortedDomains = Object.entries(domainScores).sort((a,b)=>b[1]-a[1]);
    const strongest = sortedDomains[0][0];
    const weakest = sortedDomains[sortedDomains.length-1][0];
    const interestText = (document.getElementById('s0_0')?.value || '').trim();
    const talentText = (document.getElementById('inTalent')?.value || '').trim();
    const hobbyText = (document.getElementById('inHobby')?.value || '').trim();
    const longExpText = (document.getElementById('inLongExperience')?.value || '').trim();
    const praiseText = (document.getElementById('inPraise')?.value || '').trim();

    const goalText = (document.getElementById('s0_3')?.value || '').trim();
    const gradeName = info.gradeTxt || '';
    const streamKor = info.stream==='NATURAL' ? '이공·의학' : (info.stream==='HUMAN' ? '인문·사회' : '융합');

    const careerByStrength = {
      A:'원리·문제 발견형 강점이 보입니다. 진로를 직업명 하나로 빨리 확정하기보다, 어떤 문제를 깊게 파고드는지부터 좁혀가는 방식이 맞습니다.',
      B:'목표를 구조화하고 스스로 계획하는 강점이 보입니다. 프로젝트 기획·경영·연구 설계처럼 목표와 과정을 연결하는 경험이 진로 확인에 도움이 됩니다.',
      C:'사람·상황을 조율하고 다시 회복하는 힘을 확인할 필요가 있습니다. 사람을 이해하고 협력하는 활동 속에서 진로 적합성이 더 잘 드러날 수 있습니다.',
      D:'꾸준히 실행하고 반복하는 강점이 보입니다. 실제 결과물이 남는 제작·실험·훈련형 경험을 통해 진로를 확인하는 방식이 적합합니다.'
    };
    const careerRiskByWeak = {
      A:'다만 관심 분야를 교과 질문으로 바꾸는 경험이 부족하면 진로가 막연해질 수 있습니다.',
      B:'다만 부모·학원 계획을 따르는 것과 스스로 선택하는 것을 구분하는 점검이 필요합니다.',
      C:'다만 실패나 경쟁 뒤 회복 속도가 느리다면 진로 선택도 “잘할 수 있는 것”보다 “실패하지 않을 것”으로 좁아질 수 있습니다.',
      D:'다만 관심은 많아도 꾸준한 실행 기록이 부족하면 진로가 말로만 남을 수 있습니다.'
    };


    const experienceParts = [
      talentText ? `&lt;b>특기&lt;/b> ${talentText}` : '',
      hobbyText ? `&lt;b>취미·몰입&lt;/b> ${hobbyText}` : '',
      longExpText ? `&lt;b>오래 한 경험&lt;/b> ${longExpText}` : '',
      praiseText ? `&lt;b>주변 평가&lt;/b> ${praiseText}` : ''
    ].filter(Boolean);
    const experienceBox = document.getElementById('experienceProfileBox');
    if(experienceBox){
      experienceBox.innerHTML = experienceParts.length
        ? `&lt;b>학생 개인 경험 프로필&lt;/b>&lt;br>${experienceParts.join(' · ')}&lt;br>&lt;span style="font-size:0.78em;color:#666;">이 경험을 진로·교과 질문·주제탐구로 연결해 학생마다 다른 결과물을 설계합니다.&lt;/span>`
        : `&lt;b>학생 개인 경험 프로필&lt;/b>&lt;br>&lt;span style="color:#777;">특기·취미·오래 한 경험을 입력하면 진로와 주제탐구 전략이 더 개인화됩니다.&lt;/span>`;
    }

    const experienceSeed = longExpText || hobbyText || talentText || interestText || '현재 관심 활동';

    const careerHtml = `
      &lt;b style="font-size:1.05em;">① 진로 방향 — ${streamKor} 계열을 기준으로 ‘경험으로 확인’&lt;/b>&lt;br>
      ${interestText ? `현재 관심 표현: &lt;b>${interestText}&lt;/b>&lt;br>` : ''}
      ${goalText ? `현재 목표 표현: &lt;b>${goalText}&lt;/b>&lt;br>` : ''}
      ${careerByStrength[strongest]} ${careerRiskByWeak[weakest]}&lt;br>
      &lt;span style="color:#555;">&lt;b>다음 행동:&lt;/b> 직업명을 하나 더 찾기보다 &lt;b>${experienceSeed}&lt;/b>에서 “내가 직접 확인해보고 싶은 질문 1개”를 정합니다.&lt;/span>`;

    let inquiryLevel, inquiryAction;
    if(avgs.A>=8 &amp;&amp; overallAcademicReadiness>=75){
      inquiryLevel='심화 확장형';
      inquiryAction='교과 개념 하나를 대학 기초 개념·최근 연구의 한계·반례와 연결해 “왜 기존 설명만으로 충분하지 않은가?”까지 확장합니다.';
    }else if(avgs.A>=6){
      inquiryLevel='교과 연결형';
      inquiryAction='수업에서 배운 개념 하나를 실제 현상이나 진로 관심과 연결해, 질문 → 근거 찾기 → 비교 → 나의 결론 순서로 짧은 탐구를 완성합니다.';
    }else{
      inquiryLevel='질문 형성형';
      inquiryAction='거창한 보고서보다 수업 중 “왜?”가 생긴 개념 하나를 고르고, 자료 2개를 비교해 1쪽짜리 탐구부터 완성합니다.';
    }
    const inquiryHtml = `
      &lt;b style="font-size:1.05em;">② 주제탐구 — ${inquiryLevel}&lt;/b>&lt;br>
      ${inquiryAction}&lt;br>
      &lt;span style="color:#555;">&lt;b>주제 선정 기준:&lt;/b> 진로 이름을 억지로 붙이기보다 &lt;b>교과 개념 + ${experienceSeed} + 실제 질문&lt;/b>이 만나는 지점을 우선합니다.&lt;/span>`;

    let recordFocus=[];
    if(avgs.B&lt;6.5) recordFocus.push('학생이 직접 선택한 이유와 계획을 말로 남기기');

    if(avgs.A&lt;6.5) recordFocus.push('활동 나열보다 질문이 어떻게 깊어졌는지 보여주기');
    if(avgs.C&lt;6.5) recordFocus.push('실패·수정·재도전 과정을 결과와 함께 남기기');
    if(recordFocus.length===0) recordFocus.push('강점 활동을 교과별로 흩뜨리지 말고 하나의 성장 흐름으로 연결하기');
    const recordHtml = `
      &lt;b style="font-size:1.05em;">③ 생기부 관리 — 기록보다 ‘수업 안에서 증거 만들기’&lt;/b>&lt;br>

    const actionOutlook = threeAxisOutlook((totalRaw/240)*100, overallAcademicReadiness, learningPersistence);

    document.getElementById('careerStrategyBox').innerHTML = careerHtml;
    document.getElementById('inquiryStrategyBox').innerHTML = inquiryHtml;
    document.getElementById('recordStrategyBox').innerHTML = recordHtml;

    const profileBox = document.getElementById('strategyProfileSummary');
    if(profileBox){
      profileBox.innerHTML = `
        &lt;b>진단 기반 전략 프로필&lt;/b> · 강점 &lt;b>${domainLabel[strongest]}&lt;/b> / 우선 보완 &lt;b>${domainLabel[weakest]}&lt;/b> /
        현재 준비도 &lt;b>${readinessLevel(overallAcademicReadiness)}&lt;/b> / 학업 지속력 &lt;b>${persistenceLevel(learningPersistence)}&lt;/b>&lt;br>
        &lt;span style="color:#555;">${actionOutlook.text}&lt;/span>`;
    }

    const deliverables = [
      '진로: 관심 분야를 확인할 경험 또는 질문 1개',
      '탐구: 교과 개념과 연결된 완성 결과물 1개'
    ];
    if(avgs.B&lt;6.5) deliverables.push('학생부: 학생이 직접 선택한 이유·계획 기록');
    else if(avgs.A&lt;6.5) deliverables.push('학생부: 질문이 깊어진 과정 기록');
    else deliverables.push('학생부: 활동 간 연결성과 다음 질문 기록');

    const dBox = document.getElementById('deliverableBox');
    if(dBox){
      dBox.innerHTML = `&lt;b>이번 단계에서 남길 핵심 산출물&lt;/b>&lt;br>${deliverables.map((x,i)=>`${i+1}. ${x}`).join('&lt;br>')}`;
    }


    // 4주 실행 로드맵: 약점 조합에 따라 실제 행동을 다르게 제시
    const actionNotes=[];
    if(ppNow.help&lt;6) actionNotes.push('막힌 문제를 혼자 오래 끌지 말고 48시간 안에 질문 1개 만들기');
    if(ppNow.reentry&lt;6) actionNotes.push('흐름이 깨진 날 100% 복구 대신 20분 복귀 과제부터 시작하기');
    if(ppNow.errorTol&lt;6) actionNotes.push('완벽하게 끝내기보다 80% 완성 후 제출·수정하는 연습하기');
    if(avgs.D&lt;6.5) actionNotes.push('하루 핵심 과제 3개만 정하고 완료 여부를 매일 기록하기');
    if(avgs.B&lt;6.5) actionNotes.push('주간 계획 중 최소 1개는 학생이 직접 선택하고 이유까지 적기');
    if(avgs.A&lt;6.5) actionNotes.push('매주 교과 질문 1개를 정해 자료 2개 비교하기');
    if(actionNotes.length&lt;3) actionNotes.push('한 주에 한 번 배운 내용을 1분 설명으로 정리하기');
    if(actionNotes.length&lt;3) actionNotes.push('주간 말미에 잘된 행동 1개와 바꿀 행동 1개를 기록하기');

    document.getElementById('personalActionSummary').innerHTML = `
      &lt;b>현재 상담 핵심: ${actionOutlook.title}&lt;/b>&lt;br>
      강점은 &lt;b>${domainLabel[strongest]}&lt;/b>, 우선 보완 영역은 &lt;b>${domainLabel[weakest]}&lt;/b>입니다.
      현재 학업 준비도와 학업 지속력을 함께 보아, 다음 4주는 “더 많이 하기”보다 &lt;b>성장 가능성을 실제 행동으로 확인하는 기간&lt;/b>으로 운영합니다.`;

    const priorityActions = actionNotes.slice(0,3);
    const priorityBox = document.getElementById('priorityActionBox');
    if(priorityBox){
      priorityBox.innerHTML = `
        &lt;div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;">
          ${priorityActions.map((x,i)=>`
            &lt;div style="background:#fff;border:1px solid #e2e7ee;border-radius:8px;padding:8px 9px;font-size:0.74em;line-height:1.4;">
              &lt;b style="color:var(--primary);">우선순위 ${i+1}&lt;/b>&lt;br>${x}
            &lt;/div>`).join('')}
        &lt;/div>`;
    }

    const weekRows = [
      {week:'1주',action:`${experienceSeed}에서 진로 질문 1개 확정 + 왜 궁금한지 학생 말로 정리`,output:'질문 카드 1장 / 관심 이유 3문장',check:'학생이 스스로 설명 가능'},
      {week:'2주',action:'교과 개념과 연결해 자료 2개 비교·정리',output:'자료 비교표 + 핵심 근거 3개',check:'교과 개념이 실제로 사용됨'},
      {week:'3주',action:'탐구 결과물 완성 + 반론·한계 또는 수정점 1개 추가',output:'1~2쪽 탐구 결과물 / 발표 초안',check:'학생 판단이 문장으로 남음'},
      {week:'4주',action:`행동 교정 확인: ${priorityActions[0] || '주간 행동 1개 수정'} + 다음 질문 연결`,output:'AAR 1장 / 다음 행동 1개',check:'무엇이 바뀌었는지 확인'}
    ];
    const fourWeekBody = document.getElementById('fourWeekPlanBody');
    if(fourWeekBody){
      fourWeekBody.innerHTML = weekRows.map(r=>`
        &lt;tr>
          &lt;td style="padding:6px;border:1px solid #dfe5ec;font-weight:900;text-align:center;">${r.week}&lt;/td>
          &lt;td style="padding:6px;border:1px solid #dfe5ec;line-height:1.4;">${r.action}&lt;/td>
          &lt;td style="padding:6px;border:1px solid #dfe5ec;line-height:1.4;">${r.output}&lt;/td>
          &lt;td style="padding:6px;border:1px solid #dfe5ec;line-height:1.4;">${r.check}&lt;/td>
        &lt;/tr>`).join('');
    }

    const nextConsult = document.getElementById('nextConsultBox');
    if(nextConsult){
      nextConsult.innerHTML = `
        &lt;b>다음 상담에서 확인할 것&lt;/b>&lt;br>
        ① 관심 분야가 더 구체적인 질문으로 바뀌었는가 ·
        ② 탐구 결과물에 학생의 판단이 들어갔는가 ·
        ③ ${domainLabel[weakest]} 영역의 행동이 실제로 한 가지라도 달라졌는가 ·
        ④ 학습 흐름이 깨졌을 때 다시 돌아오는 시간이 짧아졌는가`;
    }

window.scrollTo({ top: document.getElementById('p1').offsetTop, behavior: 'smooth' });
}

setTodayIfEmpty();

&lt;script>
/* ===== SG 플랫폼 연동 브리지 (APEX V26) ===== */
(function(){
'use strict';
var MODE='admin';           // 'admin' | 'student'
var NOSAVE=false;           // 복원 후 리포트 재생성 때는 저장 신호를 보내지 않음
var GRADES={elem:1,mid12:1,mid3:1};
function $(id){return document.getElementById(id);}
function post(m){try{window.parent.postMessage(m,'*');}catch(e){}}
function todayStr(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function gradeKey(g){g=String(g||'');if(GRADES[g])return g;if(/초/.test(g))return 'elem';if(/중\s*3/.test(g))return 'mid3';if(/중\s*[12]/.test(g))return 'mid12';return '';}
function inputRoot(){return document.querySelector('.container > .no-print')||document.body;}
function syncSpan(el){var n=el.nextElementSibling;if(n&amp;&amp;n.tagName==='SPAN')n.innerText=el.value;}

/* ── 입력값 스냅샷 ── */
function snapshot(){
  var root=inputRoot(), f={};
  root.querySelectorAll('input[id],select[id],textarea[id]').forEach(function(el){
    if(el.type==='radio')return;
    f[el.id]=(el.type==='checkbox')?!!el.checked:el.value;
  });
  var q=[],qd=[];
  document.querySelectorAll('.q-val').forEach(function(el){q.push(el.value);qd.push(el.dataset.domain||'');});
  var p={};
  document.querySelectorAll('.pressure-val').forEach(function(el){p[el.dataset.pid]=el.value;});
  var sess=document.querySelector('input[name="sessionType"]:checked');
  var mode=document.querySelector('input[name="operationMode"]:checked');
  return {v:'V26',session:sess?sess.value:'1',mode:mode?mode.value:'sejong',fields:f,q:q,qd:qd,p:p};
}
/* ── 복원 ── */
function setRadio(name,val){
  var r=document.querySelector('input[name="'+name+'"][value="'+val+'"]');
  if(r){r.checked=true;return true;}return false;
}
function fillFields(f){
  Object.keys(f||{}).forEach(function(id){
    var el=$(id);if(!el)return;
    if(el.type==='checkbox')el.checked=!!f[id];
    else{
      if(el.tagName==='SELECT'){
        var ok=false;for(var i=0;i&lt;el.options.length;i++){if(el.options[i].value===String(f[id])){ok=true;break;}}
        if(!ok)return;
      }
      el.value=f[id];
    }
  });
}
function restore(s){
  if(!s)return;
  if(s.session)setRadio('sessionType',s.session);
  if(s.mode)setRadio('operationMode',s.mode);
  try{if(typeof toggleSession==='function')toggleSession();}catch(e){console.warn(e);}
  var g=$('inGrade');
  if(g&amp;&amp;s.fields&amp;&amp;s.fields.inGrade){
    g.value=s.fields.inGrade;
    try{renderQuestions();}catch(e){}
    try{renderGradeSelects();}catch(e){}
    try{updateAcademicInputMode();}catch(e){}
  }
  fillFields(s.fields);
  var qs=document.querySelectorAll('.q-val');
  // 도메인 순서가 같으면 인덱스로, 아니면 도메인별 순서로 복원
  var byDom={};
  (s.q||[]).forEach(function(v,i){var d=(s.qd||[])[i]||'';(byDom[d]=byDom[d]||[]).push(v);});
  var cnt={};
  qs.forEach(function(el,i){
    var d=el.dataset.domain||'';
    var k=cnt[d]||0;cnt[d]=k+1;
    var v=(byDom[d]&amp;&amp;byDom[d][k]!==undefined)?byDom[d][k]:(s.q||[])[i];
    if(v!==undefined){el.value=v;syncSpan(el);}
  });
  document.querySelectorAll('.pressure-val').forEach(function(el){
    var v=(s.p||{})[el.dataset.pid];if(v!==undefined){el.value=v;syncSpan(el);}
  });
  setTimeout(function(){fillFields(s.fields);},60);
}
function setReadonly(on){
  inputRoot().querySelectorAll('input,select,textarea').forEach(function(el){el.disabled=!!on;});
}

/* ── 결과 요약 (관리자 저장용) ── */
function avgs(){
  var su={A:0,B:0,C:0,D:0},co={A:0,B:0,C:0,D:0};
  document.querySelectorAll('.q-val').forEach(function(el){var d=el.dataset.domain;if(su[d]===undefined)return;su[d]+=parseInt(el.value,10);co[d]++;});
  var o={};['A','B','C','D'].forEach(function(d){o[d]=co[d]?+(su[d]/co[d]).toFixed(2):0;});
  return o;
}
function txt(id){var e=$(id);return e?(e.innerText||e.textContent||'').trim():'';}
function buildResult(){
  var snap=snapshot(), f=snap.fields||{};
  var a=avgs();
  var gSel=$('inGrade');
  var gTxt=gSel&amp;&amp;gSel.selectedIndex>=0?gSel.options[gSel.selectedIndex].text.split(' ')[0]:'';
  var raw=Math.round((a.A+a.B+a.C+a.D)*6);
  var s0={};for(var i=0;i&lt;16;i++){var el=$('s0_'+i);if(el)s0['q'+i]=el.value;}
  return {ver:'V26',session:snap.session,date:f.inDate||'',school:f.inSchool||'',name:f.inName||'',
    gradeVal:f.inGrade||'',gradeTxt:gTxt,stream:String(f.inStream||'').toUpperCase(),style:f.inStyle||'',
    avgs:a,totalRaw:raw,totalAdj:raw,tier:txt('resTier'),totalText:txt('resTotal'),
    mode:snap.mode,s0:s0,snapshot:snap};
}

/* ── 기존 함수 감싸기 ── */
if(typeof window.generateReport==='function'){
  var _gen=window.generateReport;
  window.generateReport=function(){
    var r=_gen.apply(this,arguments);
    if(!NOSAVE&amp;&amp;MODE==='admin'){post({type:'APEX_SAVE',result:buildResult()});}
    return r;
  };
}
var _origPrint=window.print.bind(window);
window.print=function(){
  try{
    var f=snapshot().fields||{};var dt=String(f.inDate||'').replace(/-/g,'');
    var sess=(snapshot().session||'1');
    post({type:'APEX_SET_TITLE',title:'APEX 학업역량 정밀진단_'+(f.inName||'학생')+'_'+sess+'차진단'+(dt?('_'+dt):'')});
  }catch(e){}
  setTimeout(_origPrint,120);
};
window.addEventListener('afterprint',function(){post({type:'APEX_PRINT_DONE'});});

/* ── 학생 작성 모드 ── */
function enterStudentMode(){
  MODE='student';
  var st=document.createElement('style');
  st.textContent='.sm-hide{display:none!important}body{background:#f5f7fb}.container{padding-bottom:90px!important}'+
   '#smBar{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff;border-top:1px solid #dfe5ef;padding:10px 12px;display:flex;gap:8px;box-shadow:0 -4px 14px rgba(0,0,0,.08)}'+
   '#smBar button{flex:1;border:none;border-radius:10px;padding:13px 8px;font-size:15px;font-weight:800;cursor:pointer}'+
   '@media print{#smBar{display:none!important}}';
  document.head.appendChild(st);
  var root=inputRoot();
  var h2=root.querySelector('h2');if(h2)h2.innerText='🎯 APEX 학업역량 진단 (학생 작성)';
  var hb=root.querySelector('button[onclick="printStudentQuestionnaire()"]');if(hb)hb.classList.add('sm-hide');
  var gb=root.querySelector('button[onclick="generateReport()"]');if(gb)gb.classList.add('sm-hide');
  var om=document.querySelector('input[name="operationMode"]');
  if(om){var box=om.closest('div[style*="grid-column"]');if(box)box.classList.add('sm-hide');}
  var bar=document.createElement('div');bar.id='smBar';
  bar.innerHTML='&lt;button id="smDraft" style="background:#eef1fb;color:#3b5bdb">💾 임시저장&lt;/button>&lt;button id="smSubmit" style="background:#3b5bdb;color:#fff">✅ 제출하기&lt;/button>';
  document.body.appendChild(bar);
  $('smDraft').onclick=function(){post({type:'APEX_STUDENT_SUBMIT',final:false,snapshot:snapshot(),result:buildResult()});};
  $('smSubmit').onclick=function(){post({type:'APEX_STUDENT_SUBMIT',final:true,snapshot:snapshot(),result:buildResult()});};
}

window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='APEX_INIT_STUDENT'){
    try{
      if(d.mode==='student'&amp;&amp;MODE!=='student')enterStudentMode();
      var n=$('inName');if(n)n.value=d.name||'';
      var sc=$('inSchool');if(sc)sc.value=d.school||'';
      var dt=$('inDate');if(dt)dt.value=todayStr();
      var gk=gradeKey(d.grade),g=$('inGrade');
      if(g&amp;&amp;gk){g.value=gk;try{renderQuestions();renderGradeSelects();updateAcademicInputMode();}catch(_){}}
    }catch(err){console.warn('APEX init',err);}
  }else if(d.type==='APEX_RESTORE'){
    try{
      NOSAVE=true;
      if(d.mode==='student'&amp;&amp;MODE!=='student')enterStudentMode();
      restore(d.snapshot);
      if(d.name&amp;&amp;!$('inName').value)$('inName').value=d.name;
      if(d.school&amp;&amp;!$('inSchool').value)$('inSchool').value=d.school;
      if(d.readonly){setReadonly(true);var _b=$('smBar');if(_b&amp;&amp;_b.parentNode)_b.parentNode.removeChild(_b);}
      if(d.report||d.print){
        setTimeout(function(){
          try{window.generateReport();}catch(err){console.warn('리포트 생성 오류',err);}
          NOSAVE=false;
          if(d.print){setTimeout(function(){window.print();},1300);}
        },150);
      }else{NOSAVE=false;}
      post({type:'APEX_RESTORED'});
    }catch(err){NOSAVE=false;console.warn('APEX restore',err);post({type:'APEX_RESTORE_ERROR',message:String(err&amp;&amp;err.message||err)});}
  }else if(d.type==='APEX_GET_SNAPSHOT'){
    post({type:'APEX_SNAPSHOT',snapshot:snapshot(),result:buildResult()});
  }
});
post({type:'APEX_READY'});
})();

&lt;/script>
