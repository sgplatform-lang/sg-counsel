        !_xfinCandidates.length ? '<div style="text-align:center;color:#aaa;font-size:12px;padding:12px">이 교과목으로 작성된 월별주제활동/교과활동이 없습니다. 아래에서 직접 입력해주세요.</div>' :
        `<div style="max-height:340px;overflow-y:auto">${_xfinCandidates.map(function(c){return `
          <div onclick="xfinSelectCandidate('${c.kind}','${c.id}')" style="border:1px solid ${(t.sourceType===c.kind&&t.sourceId===c.id)?'#b8860b':'#eee'};background:${(t.sourceType===c.kind&&t.sourceId===c.id)?'#fff8e1':'#fff'};border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer">
            <div style="font-size:10px;color:#aaa">${c.kind==='topic'?'📘 월별주제활동':'📗 월별교과활동'} · ${_xlabMonthLabel(c.month)}</div>
            <div style="font-weight:700;font-size:13px;margin-top:2px">${c.topicTitle}</div>
            ${c.advancedTopicTitle?`<div style="font-size:11px;color:#7c3aed;margin-top:3px">🧭 심화·확장: ${c.advancedTopicTitle}</div>`:''}
            ${c.expectedRecordText?`<div style="font-size:11px;color:#888;margin-top:3px">📝 예상세특 있음</div>`:''}
          </div>`;}).join('')}</div>`}
      <button onclick="xfinStartManual()" style="width:100%;padding:9px;background:none;border:1.5px dashed #ccc;border-radius:8px;font-weight:700;font-size:11px;color:#666;margin-top:6px">✍️ 불러오지 않고 직접 입력할래요</button>
      <button onclick="xactOpenPicker('xfin')" style="width:100%;padding:9px;background:#f0fdfa;border:1.5px dashed #0f766e;border-radius:8px;font-weight:700;font-size:11px;color:#0f766e;margin-top:6px">📓 셀프활동 불러오기</button>
    </div>

    <div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-weight:800;font-size:14px;margin-bottom:6px">📄 항목별 내용 구성</div>
      <div style="font-size:11px;color:#888;margin-bottom:6px">항목마다 AI추천 / 직접입력 / 수정·추가 / 없음 중 하나를 선택하세요.</div>
      ${XFIN_SECTIONS.map(function(pair){ return renderXfinSectionBlock(t, pair[0], pair[1]); }).join('')}
    </div>

    <div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-weight:800;font-size:14px;margin-bottom:10px">🔗 연계 활동</div>
      <div style="font-size:10.5px;color:#888;margin-bottom:6px">여러 유형을 함께 선택할 수 있습니다.</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
        ${XFIN_LINKED_TYPES.map(function(o){
          const on = ((t.linkedActivity && t.linkedActivity.types)||[]).indexOf(o)!==-1;
          return `<button onclick="xfinChooseLinkedType('${o}')" style="padding:7px 12px;border-radius:16px;border:1.5px solid ${on?'#3b5bdb':'#ddd'};background:${on?'#3b5bdb':'#fff'};color:${on?'#fff':'#333'};font-weight:700;font-size:11px">${on?'✓ ':''}${o}</button>`;
        }).join('')}
      </div>
      ${(t.linkedActivity && (t.linkedActivity.types||[]).indexOf('직접입력')!==-1) ? `<input id="xfinLinkedTypeCustom" placeholder="연계활동 유형 직접 입력" value="${((t.linkedActivity&&t.linkedActivity.typeCustom)||'').replace(/"/g,'&quot;')}" style="margin-bottom:10px">` : ''}
      ${(t.linkedActivity && (t.linkedActivity.types||[]).length) ? `
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button onclick="xfinChooseLinkedMode('ai')" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid ${(t.linkedActivity.mode==='ai')?'#3b5bdb':'#ddd'};background:${(t.linkedActivity.mode==='ai')?'#3b5bdb18':'#fff'};font-weight:700;font-size:11px">🤖 AI추천</button>
        <button onclick="xfinChooseLinkedMode('manual')" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid ${(t.linkedActivity.mode==='manual')?'#3b5bdb':'#ddd'};background:${(t.linkedActivity.mode==='manual')?'#3b5bdb18':'#fff'};font-weight:700;font-size:11px">✍️ 직접입력</button>
        <button onclick="xfinChooseLinkedMode('none')" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid ${(t.linkedActivity.mode==='none')?'#3b5bdb':'#ddd'};background:${(t.linkedActivity.mode==='none')?'#3b5bdb18':'#fff'};font-weight:700;font-size:11px">🚫 없음</button>
      </div>
      ${t.linkedActivity.mode==='ai' ? `<button onclick="xfinGenerateLinkedActivity()" ${_xfinLinkedLoading?'disabled':''} style="width:100%;padding:10px;background:#8f7fe0;color:#fff;border:none;border-radius:8px;font-weight:800;margin-bottom:6px">${_xfinLinkedLoading?'⏳ 생성 중...':(t.linkedActivity.text?'🔄 다시 생성':'AI로 생성')}</button>
        <textarea id="xfinLinkedContent" rows="3" style="font-size:13px">${String(t.linkedActivity.text||'').replace(/</g,'&lt;')}</textarea>` :
        t.linkedActivity.mode==='manual' ? `<textarea id="xfinLinkedContent" rows="3" placeholder="연계 활동 내용을 입력하세요" style="font-size:13px">${String(t.linkedActivity.text||'').replace(/</g,'&lt;')}</textarea>` :
        t.linkedActivity.mode==='none' ? '<div style="text-align:center;color:#aaa;font-size:11px;padding:8px">연계활동을 포함하지 않습니다.</div>' :
        '<div style="text-align:center;color:#aaa;font-size:11px;padding:8px">위에서 방법을 선택해주세요.</div>'}
      ` : ''}
    </div>

    <div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:30px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:800;font-size:14px">🏆 최종 예상세특 (500자)</span>
        ${t.finalRecordText ? `<button onclick="xfinPrintReport()" style="padding:7px 14px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px">🖨 인쇄/PDF</button>` : ''}
      </div>
      ${t.finalRecordText ? `<textarea id="xfinFinalRecordText" rows="7" maxlength="500" oninput="document.getElementById('xfinFinalCount').textContent=this.value.length" style="font-size:13px;background:#fffbe6">${String(t.finalRecordText).replace(/</g,'&lt;')}</textarea>
        <div style="text-align:right;font-size:11px;color:#999;margin:4px 0 10px"><span id="xfinFinalCount">${String(t.finalRecordText).length}</span>/500자</div>` :
        '<div style="text-align:center;color:#aaa;font-size:12px;padding:16px">아직 생성되지 않았습니다.</div>'}
      <button onclick="xfinGenerateFinalRecord()" ${_xfinFinalLoading?'disabled':''} style="width:100%;padding:12px;background:#b8860b;color:#fff;border:none;border-radius:10px;font-weight:800;margin-bottom:8px">${_xfinFinalLoading?'⏳ 생성 중...':(t.finalRecordText?'🔄 최종 예상세특 다시 생성':'🏆 최종 예상세특 생성')}</button>
      <button onclick="xfinSaveRecord()" style="width:100%;padding:12px;background:#3b5bdb;color:#fff;border:none;border-radius:10px;font-weight:800">💾 저장하기</button>
    </div>
  </div>
  ${xactPickerHtml()}`;
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
