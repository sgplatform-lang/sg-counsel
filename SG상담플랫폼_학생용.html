async function xlabSaveTopic(){
  if(!_xlabCurrent.topicTitle){ alert('저장할 주제 내용이 없습니다.'); return; }
  if(!_xlabCurrent.advancedTopicTitle){ alert('"⑥ 주제 심화·확장 추천" 항목은 필수입니다. 후속 주제를 선택하거나 입력해주세요.'); return; }
  // 보고서(인쇄용)에 학교/학년/이름을 함께 표기하기 위한 스냅샷 — 저장 시점 기준으로 최신화
  _xlabCurrent.studentName = CU.name||'';
  _xlabCurrent.studentSchool = CU.school||'';
  _xlabCurrent.studentGrade = CU.grade||'';
  if(!_xlabCurrent.report) _xlabCurrent.report = {reason:'',concept:'',example:'',issue:'',activity:''};
  ['reason','concept','example','issue','activity'].forEach(function(f){
    const el = document.getElementById('xlabReport_'+f);
    if(el) _xlabCurrent.report[f] = el.value;
  });
  for(const pair of XLAB_REPORT_FIELDS){
    const f = pair[0], label = pair[1];
    if(!String(_xlabCurrent.report[f]||'').trim()){
      alert('"'+label+'" 항목은 필수 입력입니다. AI로 생성하거나 직접 입력해주세요.');
      return;
    }
  }
  _xlabCurrent.report.savedAt = Date.now();
  try{
    if(FB()) await window._fb.set('xlabTopics', _xlabCurrent.id, _xlabCurrent);
    toast('저장되었습니다 💾');
    await _xlabLoadList();
    _xlabView='list'; _xlabCurrent=null; render();
  }catch(e){ alert('저장 실패: '+e.message); }
}

function xlabDeleteTopic(id){
  if(!confirm('이 주제활동을 삭제하시겠습니까?')) return;
  (async function(){
    try{
      if(FB()) await window._db.collection('xlabTopics').doc(id).delete();
      toast('삭제되었습니다');
      await _xlabLoadList();
    }catch(e){ alert('삭제 실패: '+e.message); }
  })();
}

function _xlabBuildFullReportHtml(t){
  const savedDate = (t.report && t.report.savedAt) ? new Date(t.report.savedAt) : new Date();
  const dateStr = savedDate.getFullYear()+'.'+String(savedDate.getMonth()+1).padStart(2,'0')+'.'+String(savedDate.getDate()).padStart(2,'0');
  // ★ 2026-09-28 추가: 이 필드를 나중에 추가했기 때문에, 그 이전에 저장된 주제활동
  // 문서에는 studentSchool/studentGrade 스냅샷이 없을 수 있다. 그런 경우 지금 로그인한
  // 학생 본인(CU) 정보로 보충한다.
  const schoolVal = t.studentSchool || (typeof CU!=='undefined' && CU ? CU.school : '') || '';
  const gradeVal = t.studentGrade || (typeof CU!=='undefined' && CU ? CU.grade : '') || '';
  // ★ 2026-09-28 추가: 브라우저의 "PDF로 저장"은 <title>을 파일명으로 그대로 쓰므로,
  // "학생명_X-lab 주제활동 보고서_YYYYMMDD" 형태가 되도록 제목을 동적으로 구성한다.
  const dateCompact = savedDate.getFullYear()+String(savedDate.getMonth()+1).padStart(2,'0')+String(savedDate.getDate()).padStart(2,'0');
  const pdfTitle = (t.studentName?(_xlabEsc(t.studentName)+'_'):'')+'X-lab 주제활동 보고서_'+dateCompact;
  const sections = [
    ['주제 선정이유', t.report&&t.report.reason],
    ['개념·원리·이론', t.report&&t.report.concept],
    ['실사례 예시', t.report&&t.report.example],
    ['문제점·개선점', t.report&&t.report.issue],
    ['교내활동 예시', t.report&&t.report.activity],
  ];
  let html = '<html><head><meta charset="utf-8"><title>'+pdfTitle+'</title>'
    +'<style>'
    +'body{font-family:"Apple SD Gothic Neo",sans-serif;padding:40px;line-height:1.7;color:#1a1a2e}'
    +'h1{font-size:22px;text-align:center;margin:0 0 14px}'
    +'hr{border:none;border-top:2px solid #1a1a2e;margin:14px 0}'
    +'.meta-row{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:#333}'
    +'.meta-row b{color:#111}'
    +'.topic-box{background:#f8f9fc;border-radius:10px;padding:14px 16px;margin:14px 0;font-size:13px}'
    +'.topic-box div{margin-bottom:4px}'
    +'h2{font-size:14px;margin:20px 0 6px;color:#3b5bdb;border-left:4px solid #3b5bdb;padding-left:8px}'
    +'p{font-size:13px;white-space:pre-wrap;margin:0 0 4px}'
    +'.record-box{border:1px solid #ddd;border-radius:8px;padding:14px;font-size:13px;white-space:pre-wrap}'
    +'</style></head><body>'
    +'<h1>📘 X-lab 주제활동 보고서</h1>'
    +'<hr>'
    +'<div class="meta-row">'
      +'<span>년월일: <b>'+dateStr+'</b></span>'
      +'<span>학교: <b>'+_xlabEsc(schoolVal)+'</b></span>'
      +'<span>학년: <b>'+_xlabEsc(gradeVal)+'</b></span>'
      +'<span>이름: <b>'+_xlabEsc(t.studentName)+'</b></span>'
      +'<span>희망학과: <b>'+_xlabEsc(t.department)+'</b></span>'
    +'</div>'
    +'<hr>'
    +'<div class="topic-box">'
      +'<div><b>선택 주제:</b> '+_xlabEsc(t.topicTitle)+'</div>'
      +(t.topicDesc?('<div style="color:#666">'+_xlabEsc(t.topicDesc)+'</div>'):'')
      +'<div><b>교과목:</b> '+_xlabEsc(t.subjectArea||'-')+'</div>'
      +'<div><b>교과개념:</b> '+_xlabEsc(t.subjectConcept||'-')+'</div>'
    +'</div>'
    +'<hr>';
  sections.forEach(function(pair){
    html += '<h2>'+pair[0]+'</h2><p>'+_xlabEsc(pair[1])+'</p>';
  });
  html += '<h2>주제 심화·확장 추천</h2><p>'+(t.advancedTopicTitle ? (_xlabEsc(t.advancedTopicTitle)+(t.advancedTopicDesc?(' — '+_xlabEsc(t.advancedTopicDesc)):'')) : '(미선택)')+'</p>';
  if(t.expectedRecord){
    html += '<hr><h2>📝 예상 세특 ('+_xlabEsc(t.expectedRecord.subject)+')</h2><div class="record-box">'+_xlabEsc(t.expectedRecord.recordText)+'</div>';
  }
  html += '<script>window.onload=function(){setTimeout(function(){window.print();},500);};<\/script></body></html>';
  return html;
}

function xlabOpenRecordWizard(){
  if(!_xlabCurrent || !_xlabCurrent.report || !_xlabCurrent.report.savedAt){ alert('먼저 주제탐구 보고서를 생성·저장해주세요.'); return; }
  _xlabRecordChoice = {subject:'',subjectCustom:'',motivation:'',motivationCustom:'',relatedActivity:'',relatedActivityCustom:'',linkedActivity:'',linkedActivityCustom:''};

function xlabCloseRecordWizard(){ _xlabRecordWizardStep=0; render(); }
function xlabWizardChoose(field, val){ _xlabRecordChoice[field] = val; render(); }
function xlabWizardCustomIdFor(step){
  return {1:'xlabSubjectCustom',2:'xlabMotivationCustom',3:'xlabRelatedCustom',4:'xlabLinkedCustom'}[step];
}
function xlabWizardFieldFor(step){
  return {1:'subject',2:'motivation',3:'relatedActivity',4:'linkedActivity'}[step];
}
function xlabWizardNext(){
  const step = _xlabRecordWizardStep;
  const field = xlabWizardFieldFor(step);
  const customEl = document.getElementById(xlabWizardCustomIdFor(step));
  if(customEl) _xlabRecordChoice[field+'Custom'] = customEl.value.trim();
  if(step<4 && !_xlabRecordChoice[field]){ alert('선택지를 골라주세요.'); return; }
  if(step<4 && _xlabRecordChoice[field]==='직접입력' && !_xlabRecordChoice[field+'Custom']){ alert('직접 입력 내용을 적어주세요.'); return; }
  _xlabRecordWizardStep = step+1;
  render();
}
function xlabWizardPrev(){ _xlabRecordWizardStep = Math.max(1,_xlabRecordWizardStep-1); render(); }
function xlabWizardSkipLinked(){
  _xlabRecordChoice.linkedActivity=''; _xlabRecordChoice.linkedActivityCustom='';
  xlabGenerateRecord();
}
function xlabWizardFinishLinked(){
  const customEl = document.getElementById('xlabLinkedCustom');
  if(customEl) _xlabRecordChoice.linkedActivityCustom = customEl.value.trim();
  if(_xlabRecordChoice.linkedActivity==='직접입력' && !_xlabRecordChoice.linkedActivityCustom){ alert('직접 입력 내용을 적어주세요.'); return; }
  xlabGenerateRecord();
}

async function xlabGenerateRecord(){
  const c = _xlabRecordChoice;
  const subject = c.subject==='직접입력' ? c.subjectCustom : c.subject;
  const motivation = c.motivation==='직접입력' ? c.motivationCustom : c.motivation;
  const relatedActivity = c.relatedActivity==='직접입력' ? c.relatedActivityCustom : c.relatedActivity;
  const linkedActivity = c.linkedActivity ? (c.linkedActivity==='직접입력' ? c.linkedActivityCustom : c.linkedActivity) : '';
  if(!subject || !motivation || !relatedActivity){ alert('필수 항목이 비어있습니다. 처음부터 다시 진행해주세요.'); _xlabRecordWizardStep=1; render(); return; }
  const t = _xlabCurrent;
  // ★ 2026-09-29 수정: 예상세특 AI가 "탐구계기"와 "개념" 두 항목만 보고 작성해서 내용이
  // 빈약했음 — 실사례/문제점·개선점/교내활동 예시까지, 그리고 심화·확장주제까지 모두
  // 넘겨서 세특 문구에 구체적인 활동과 후속 연계활동 언급이 자연스럽게 들어가게 한다.
  const reportSummary = t.report
    ? ['reason','concept','example','issue','activity'].map(function(k){return t.report[k]||'';}).filter(Boolean).join(' ')
      + (t.advancedTopicTitle ? (' [심화·확장 주제] '+t.advancedTopicTitle+(t.advancedTopicDesc?(' - '+t.advancedTopicDesc):'')) : '')
    : '';
  _xlabRecordLoading = true; render();
  try{
    const r = await window._fb.xlabGenerateExpectedRecord({
      department:t.department, topic:t.topicTitle, reportSummary: reportSummary.slice(0,2000),
      subject, motivation, relatedActivity, linkedActivity,
    });
    t.expectedRecord = { subject, motivation, relatedActivity, linkedActivity, recordText:r.recordText, generatedAt:Date.now() };
    _xlabRecordWizardStep = 0;
  }catch(e){
    alert('예상세특 생성 중 오류가 발생했습니다: '+e.message);
  }
  _xlabRecordLoading = false; render();
}

  const loadedMonth = _xactMonth;
  _xactLoading = true; render();
  try{
    const all = await window._fb.getWhere('xlabSelfActivities','studentId','==',String(CU.id));
    _xactList = (all||[]).filter(function(t){return t.month===loadedMonth;}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  }catch(e){
    console.warn('월별셀프활동 목록 로딩 실패:', e.message);
    _xactList = [];
  }
  _xactLoadedForMonth = loadedMonth;
  _xactLoading = false; render();
}
function xactChangeMonth(m){
  _xactMonth = m; _xactView='list'; _xactCurrent=null;
  _xactLoadList();
}
function xactNewEntry(){

    studentGrade: CU.grade||'',
    month: _xactMonth,
    activityType: '', activityTypeCustom: '',
    fieldCategory: '', fieldDetail: '', fieldDetailCustom: '',
    interestTopic: '',
    motivation: {type:'', subjectArea:'', subjectAreaCustom:'', subjectConcept:'', bookTitle:'', bookAuthor:'', bookQuestion:'', schoolActivityType:'', schoolActivityTypeCustom:'', schoolQuestion:''},
    role: '', roleCustom: '',
    skills: [], skillsCustom: '',
    learned: '',
    createdAt: Date.now()
  };
  _xactView='edit';
  render();
}
function xactBackToList(){ _xactView='list'; _xactCurrent=null; render(); }
function xactOpenExisting(id){
  _xactCurrent = _xactList.find(function(t){return t.id===id;}) || null;

  render();
}
function xactDeleteEntry(id){
  if(!confirm('이 활동 기록을 삭제하시겠습니까?')) return;

    try{
      if(FB()) await window._db.collection('xlabSelfActivities').doc(id).delete();
      toast('삭제되었습니다');
      await _xactLoadList();
    }catch(e){ alert('삭제 실패: '+e.message); }

// ★ 2026-09-30 수정(관리자 요청: "자동저장보다는 하단에 셀프활동저장을 누르면"):
// 탭/입력할 때마다 자동저장하지 않고, 화면 내 상태(모델)만 갱신했다가 아래
// "💾 셀프활동 저장" 버튼(xactSaveEntry)을 눌렀을 때만 실제로 Firestore에 저장한다.
async function xactSaveEntry(){
  if(!_xactCurrent) return;
  _xactCurrent.studentName = CU.name||'';
  _xactCurrent.studentSchool = CU.school||'';
  _xactCurrent.studentGrade = CU.grade||'';
  _xactCurrent.updatedAt = Date.now();
  try{
    if(FB()) await window._fb.set('xlabSelfActivities', _xactCurrent.id, _xactCurrent);
    toast('셀프활동이 저장되었습니다 💾');
    _xactView='list'; _xactCurrent=null;
    await _xactLoadList();
  }catch(e){ alert('저장 실패: '+e.message); }
}
// 챌린저 AAR의 chgAarSetField와 동일한 방식(다시 누르면 선택 해제)의 범용 버전 —
// keyPath로 중첩 필드(예: 'motivation.type')도 지정할 수 있게 한 것만 다르다.
function xactChoose(keyPath, val, resetPaths){
  if(!_xactCurrent) return;
  const parts = keyPath.split('.');
  let obj = _xactCurrent;
  for(let i=0;i<parts.length-1;i++){ if(!obj[parts[i]]) obj[parts[i]]={}; obj=obj[parts[i]]; }
  const last = parts[parts.length-1];
  obj[last] = (obj[last]===val) ? '' : val;
  (resetPaths||[]).forEach(function(rp){
    const rparts=rp.split('.'); let robj=_xactCurrent;
    for(let i=0;i<rparts.length-1;i++){ if(!robj[rparts[i]]) robj[rparts[i]]={}; robj=robj[rparts[i]]; }
    robj[rparts[rparts.length-1]]='';
  });
  render();
}
// 챌린저 AAR의 chgAarToggleMulti와 동일한 방식(최대 개수 제한 시 가장 오래된 것을
// 밀어냄) — max를 0으로 두면 무제한 다중선택(예: 사용 기법)이 된다.
function xactToggleMulti(keyPath, val, max){
  if(!_xactCurrent) return;
  const parts = keyPath.split('.');
  let obj = _xactCurrent;
  for(let i=0;i<parts.length-1;i++){ if(!obj[parts[i]]) obj[parts[i]]={}; obj=obj[parts[i]]; }
  const last = parts[parts.length-1];
  const cur = Array.isArray(obj[last]) ? obj[last].slice() : [];
  const i = cur.indexOf(val);
  if(i>-1) cur.splice(i,1);
  else{ if(max&&cur.length>=max) cur.shift(); cur.push(val); }
  obj[last]=cur;
  render();
}
// 자유서술형 텍스트는 저장 버튼을 누르기 전까지는 모델에만 반영한다(매 입력마다
// render()하면 커서 위치가 튀는 문제는 여전히 피해야 하므로 render()는 호출하지 않음).
function xactSetText(keyPath, val){
  if(!_xactCurrent) return;
  const parts = keyPath.split('.');
  let obj = _xactCurrent;
  for(let i=0;i<parts.length-1;i++){ if(!obj[parts[i]]) obj[parts[i]]={}; obj=obj[parts[i]]; }
  obj[parts[parts.length-1]] = val;
}
function _xactGet(keyPath){
  if(!_xactCurrent) return '';
  const parts = keyPath.split('.');
  let obj = _xactCurrent;
  for(let i=0;i<parts.length;i++){ if(obj==null) return ''; obj=obj[parts[i]]; }
  return obj==null ? '' : obj;
}
function _xactChipRow(opts, curVal, fn){
  return `<div style="display:flex;flex-wrap:wrap;gap:6px">${opts.map(function(o){
    const on = curVal===o;
    return `<span onclick="${fn(o)}" style="padding:7px 11px;border-radius:16px;font-size:11.5px;font-weight:700;cursor:pointer;border:1.5px solid ${on?'#3b5bdb':'#e2e8f0'};background:${on?'#3b5bdb':'#fff'};color:${on?'#fff':'#333'}">${esc(o)}</span>`;
  }).join('')}</div>`;
}
function _xactChipRowMulti(opts, curArr, fn){
  return `<div style="display:flex;flex-wrap:wrap;gap:6px">${opts.map(function(o){
    const on = Array.isArray(curArr)&&curArr.includes(o);
    return `<span onclick="${fn(o)}" style="padding:7px 11px;border-radius:16px;font-size:11.5px;font-weight:700;cursor:pointer;border:1.5px solid ${on?'#0f766e':'#e2e8f0'};background:${on?'#0f766e':'#fff'};color:${on?'#fff':'#333'}">${esc(o)}</span>`;
  }).join('')}</div>`;
}
function _xactField(label, chipsHtml, extraHtml){
  return `<div style="margin-bottom:16px">
    <div style="font-size:12.5px;font-weight:800;margin-bottom:6px">${label}</div>
    ${chipsHtml}
    ${extraHtml||''}

}
function _xactOnClickStr(fnName, keyPath, val, extra){
  const escVal = esc(val).replace(/'/g,"\\'");
  return fnName+"('"+keyPath+"','"+escVal+"'"+(extra!=null?','+extra:'')+")";
}
// ★ 2026-09-30 추가(관리자 요청: "활동유형마다 활동횟수(누적),관련분야(최근),관심주제(최근)를

// 이번 달 누적 건수와 가장 최근(createdAt 기준) 기록의 관련분야·관심주제를 계산한다. 활동
// 유형은 하나도 빠짐없이(기록이 0건이어도) 전부 보여준다.
function _xactStatusRows(){
  return XACT_TYPE_OPTS.map(function(type){
    const matches = _xactList.filter(function(e){return e.activityType===type;}).slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    const recent = matches[0];
    const fieldLabel = recent ? [recent.fieldCategory, (recent.fieldDetail==='직접입력'?recent.fieldDetailCustom:recent.fieldDetail)].filter(Boolean).join(' · ') : '';
    return {
      type: type,
      count: matches.length,
      fieldLabel: fieldLabel,
      topicLabel: recent ? (recent.interestTopic||'') : '',
    };
  });
}

function _xaarLabel(opts, code){ const f=(opts||[]).find(function(p){return p[1]===code;}); return f?f[0]:(code||''); }

// 🧪 X-lab AAR 심화형(G~J) + 자료카드·교사검토 (2026-09-30 추가) — 명세 3장
// "교과 심화형"과 5장 "교사 화면"을 전체 구현. 기본형(B~F) 완료 뒤 "교과 심화하기"
// 버튼으로 진입, 교사가 관리자 화면에서 등록한 개념카드/자료카드(xlabConceptCards/
// xlabResourceCards, 전체 공유 컬렉션)를 학생이 고르고, 관리자는 세션별로 확인·
// 상담·행동변경·작업물확인(교사검토)을 남길 수 있다.

const XAAR_H_OPTS = [['교과서·수업 자료','TEXTBOOK'],['심화 강의','LECTURE'],['도서','BOOK'],['학회 발표·자료','CONFERENCE'],['리뷰·기술동향 보고서','REVIEW_REPORT'],['논문','PAPER'],['아직 확인 안 함','NOT_READ']];
const XAAR_I_OPTS = [['대상 범위','LIMIT_SCOPE'],['데이터 부족','LIMIT_DATA'],['가정·변수 차이','LIMIT_ASSUMPTION'],['측정 오차','LIMIT_MEASURE'],['다른 연구와 불일치','LIMIT_CONFLICT'],['비용·안전·윤리','LIMIT_PRACTICAL'],['아직 모름','LIMIT_UNKNOWN']];
const XAAR_J_OPTS = [['대상 비교','CHANGE_TARGET'],['조건·변수 변경','CHANGE_VARIABLE'],['측정법 변경','CHANGE_METHOD'],['반례 확인','CHECK_COUNTER'],['두 방법 결합','COMBINE_METHODS'],['작은 검증 실험','TEST_LIMIT'],['아직 결정 못함','CHANGE_UNKNOWN']];
const XAAR_J_UNKNOWN_OPTS = [['한계 부분 다시 보기','REVIEW_LIMIT'],['교사에게 적용 조건 질문','ASK_CONDITION'],['다른 자료 한계와 비교','COMPARE_LIMIT']];
const XAAR_DEEP_TRIGGER_STAGES = ['QUESTION','SOURCE','ANALYSIS','CONCLUSION'];
function _xaarDeepEligible(t){ return !!(t && XAAR_DEEP_TRIGGER_STAGES.indexOf(t.stageCode)>=0); }
// 다음 회차 A화면·목록카드에 보여줄 "지난번 행동" 문구의 우선순위(명세 3장 끝부분):
// 교사 지정(교사검토 다음행동변경) > 심화 J(있으면) > 기본 F
function _xaarPendingActionLabel(session){
  if(!session) return '';
  if(session.review && session.review.teacherOverrideActionLabel) return session.review.teacherOverrideActionLabel;
  if(session.deepening && session.deepening.changeLabel) return session.deepening.changeLabel;
  return session.nextActionLabel || '';
}

let _xaarList = []; // [{sourceType,sourceId,sourceTitle,createdAt}] — 학생이 등록한 주제활동/교과활동/최종예상세특 전체(전체 월)
let _xaarSessions = []; // 이 학생의 xlabAar 제출 전체(전체 프로젝트)
let _xaarLoading = false;
let _xaarLoaded = false;
let _xaarView = 'list'; // 'list' | 'wizard' | 'history' | 'viewSession'
let _xaarSourceType = null;
let _xaarSourceId = null;
let _xaarSourceTitle = null;
let _xaarStep = 'B'; // 'A' | 'A1' | 'B' | 'C' | 'D' | 'E' | 'F' | 'RESULT'
let _xaarPrevSession = null;
let _xaarCurrent = null;
let _xaarHistoryList = [];
let _xaarViewSessionObj = null;
let _xaarConceptCardsAll = null; // null=아직 미조회, []=조회했지만 없음
let _xaarResourceCardsAll = null;
let _xaarDeepStep = null; // null | 'G' | 'H' | 'H2' | 'I' | 'J' | 'DEEPRESULT'
let _xaarDeepCurrent = null;

async function _xaarLoadAll(){
  if(!FB() || !CU) return;
  _xaarLoading = true; render();
  try{
    const [topics, subs, fins, selfActs, sessions] = await Promise.all([
      window._fb.getWhere('xlabTopics','studentId','==',String(CU.id)),
      window._fb.getWhere('xlabSubjectReports','studentId','==',String(CU.id)),
      window._fb.getWhere('xlabFinalRecords','studentId','==',String(CU.id)),
      window._fb.getWhere('xlabSelfActivities','studentId','==',String(CU.id)),
      window._fb.getWhere('xlabAar','studentId','==',String(CU.id)),
    ]);
    const items = [];
    (topics||[]).forEach(function(t){ if(t.topicTitle) items.push({sourceType:'topic', sourceId:t.id, sourceTitle:t.topicTitle, createdAt:t.createdAt||0}); });
    (subs||[]).forEach(function(t){ if(t.topicTitle) items.push({sourceType:'subject', sourceId:t.id, sourceTitle:t.topicTitle, createdAt:t.createdAt||0}); });
    (fins||[]).forEach(function(t){ if(t.topicTitle) items.push({sourceType:'final', sourceId:t.id, sourceTitle:t.topicTitle, createdAt:t.createdAt||0}); });
    (selfActs||[]).forEach(function(t){ if(t.interestTopic) items.push({sourceType:'self', sourceId:t.id, sourceTitle:t.interestTopic, createdAt:t.createdAt||0}); });
    items.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    _xaarList = items;
    _xaarSessions = (sessions||[]).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  }catch(e){
    console.warn('X-lab AAR 목록 로딩 실패:', e.message);
    _xaarList = []; _xaarSessions = [];
  }
  _xaarLoaded = true; _xaarLoading = false; render();
}
function _xaarSessionsFor(sourceId){
  return _xaarSessions.filter(function(s){return s.sourceId===sourceId;}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
}
function xaarBackToList(){
  _xaarView='list'; _xaarSourceType=null; _xaarSourceId=null; _xaarSourceTitle=null;
  _xaarCurrent=null; _xaarPrevSession=null; _xaarHistoryList=[]; _xaarViewSessionObj=null;
  _xaarDeepStep=null; _xaarDeepCurrent=null;
  if(!_xaarLoaded) _xaarLoadAll(); else render();
}
function xaarStart(sourceType, sourceId){
  const item = _xaarList.find(function(x){return x.sourceType===sourceType && x.sourceId===sourceId;});
  if(!item) return;
  _xaarSourceType = sourceType; _xaarSourceId = sourceId; _xaarSourceTitle = item.sourceTitle;
  const prevList = _xaarSessionsFor(sourceId);
  _xaarPrevSession = prevList.length ? prevList[0] : null;
  _xaarDeepStep = null; _xaarDeepCurrent = null;
  _xaarCurrent = {
    id: 'xaar_'+CU.id+'_'+Date.now(),
    studentId: String(CU.id),
    studentName: CU.name||'', studentSchool: CU.school||'', studentGrade: CU.grade||'',
    sourceType: sourceType, sourceId: sourceId, sourceTitle: item.sourceTitle,
    prevActionCode: _xaarPrevSession ? (_xaarPrevSession.nextActionCode||'') : '',
    prevActionLabel: _xaarPrevSession ? _xaarPendingActionLabel(_xaarPrevSession) : '',
    actionExecution: '', notDoneReason: '',
    stageCode: '', contributionCodes: [], blockerCode: '', evidenceCodes: [], nextActionCode: '', nextActionLabel: '',
    status: 'submitted',
    createdAt: Date.now(),
  };
  _xaarStep = _xaarPrevSession ? 'A' : 'B';
  _xaarView = 'wizard';
  render();
}
function _xaarStepOrder(){
  const arr = [];
  if(_xaarPrevSession) arr.push('A');
  if(_xaarCurrent && (_xaarCurrent.actionExecution==='partial'||_xaarCurrent.actionExecution==='not_done')) arr.push('A1');
  arr.push('B','C','D','E','F');
  return arr;
}
function xaarBack(){
  const order = _xaarStepOrder();
  const idx = order.indexOf(_xaarStep);
  if(idx>0){ _xaarStep = order[idx-1]; render(); }
  else { xaarBackToList(); }
}
function xaarChoose(field, code){
  if(!_xaarCurrent) return;
  _xaarCurrent[field] = code;
  if(field==='actionExecution'){
    _xaarStep = (code==='partial'||code==='not_done') ? 'A1' : 'B';
  }else if(field==='notDoneReason'){
    _xaarStep = 'B';
  }else if(field==='stageCode'){
    _xaarStep = 'C';
  }else if(field==='blockerCode'){
    _xaarCurrent.nextActionCode=''; _xaarCurrent.nextActionLabel='';
    _xaarStep = 'E';
  }else if(field==='nextActionCode'){
    _xaarCurrent.nextActionLabel = _xaarLabel(XAAR_F_BY_D[_xaarCurrent.blockerCode]||[], code);
    xaarSubmit();
    return;
  }
  render();
}
function xaarToggleMulti(field, code, exclusiveCode, max){
  if(!_xaarCurrent) return;
  let arr = _xaarCurrent[field] || [];
  if(code === exclusiveCode){
    arr = arr.includes(code) ? [] : [code];
  }else{
    arr = arr.filter(function(c){return c!==exclusiveCode;});
    if(arr.includes(code)){
      arr = arr.filter(function(c){return c!==code;});
    }else{
      arr = arr.concat([code]);
      if(arr.length > max) arr = arr.slice(arr.length-max);
    }
  }
  _xaarCurrent[field] = arr;
  render();
}
function xaarStepTo(step){ _xaarStep = step; render(); }
async function xaarSubmit(){
  if(!_xaarCurrent) return;
  try{
    if(FB()) await window._fb.set('xlabAar', _xaarCurrent.id, _xaarCurrent);
    _xaarSessions.unshift(_xaarCurrent);
    _xaarStep = 'RESULT';
    render();
  }catch(e){ alert('저장 실패: '+e.message); }
}
function xaarOpenHistory(sourceType, sourceId){
  const item = _xaarList.find(function(x){return x.sourceType===sourceType && x.sourceId===sourceId;});
  _xaarSourceType = sourceType; _xaarSourceId = sourceId; _xaarSourceTitle = item?item.sourceTitle:'';
  _xaarHistoryList = _xaarSessionsFor(sourceId);
  _xaarView = 'history';
  render();
}
function xaarViewSession(id){
  _xaarViewSessionObj = _xaarHistoryList.find(function(s){return s.id===id;}) || _xaarSessions.find(function(s){return s.id===id;}) || null;
  _xaarView = 'viewSession';
  render();
}
function xaarBackToHistory(){ _xaarView='history'; render(); }

function _xaarChip(label, code, active, onclick){
  return `<button onclick="${onclick}" style="padding:9px 14px;border-radius:20px;border:1.5px solid ${active?'#3b5bdb':'#ddd'};background:${active?'#3b5bdb':'#fff'};color:${active?'#fff':'#333'};font-weight:700;font-size:12.5px;margin:4px 6px 4px 0">${esc(label)}</button>`;
}
function _xaarChipRowSingle(opts, curVal, field){
  return (opts||[]).map(function(p){ return _xaarChip(p[0], p[1], curVal===p[1], `xaarChoose('${field}','${p[1]}')`); }).join('');
}
function _xaarChipRowMulti(opts, curArr, field, exclusiveCode, max){
  curArr = curArr||[];
  return (opts||[]).map(function(p){ return _xaarChip(p[0], p[1], curArr.includes(p[1]), `xaarToggleMulti('${field}','${p[1]}','${exclusiveCode}',${max})`); }).join('');
}
// 심화형(G~J)은 별도 객체(_xaarDeepCurrent)에 저장되고 핸들러 함수도 단계마다 다르므로,
// 필드명 대신 호출할 함수 이름을 그대로 받는 범용 칩행(chip row) 렌더러.
function _xaarChipRowCustom(opts, curVal, handlerName){
  return (opts||[]).map(function(p){ return _xaarChip(p[0], p[1], curVal===p[1], `${handlerName}('${p[1]}')`); }).join('');
}

// ── 🧪 교과 심화형(G~J) 흐름 ──────────────────────────────────────────────
async function _xaarLoadConceptCards(){
  if(_xaarConceptCardsAll!==null) return;

function _xaarResourceCardsForType(type){
  return (_xaarResourceCardsAll||[]).filter(function(c){return c.resourceType===type;}).slice(0,5);
}
function xaarStartDeepening(){
  if(!_xaarCurrent) return;
  _xaarDeepCurrent = { conceptId:'', conceptUnknown:false, resourceType:'', resourceCardId:'', readStatus:'', limitationCode:'', changeCode:'', changeLabel:'' };
  _xaarDeepStep = 'G';

function xaarSkipDeepening(){ _xaarDeepStep=null; _xaarDeepCurrent=null; render(); }
function _xaarDeepStepOrder(){
  const arr=['G','H'];
  if(_xaarDeepCurrent && _xaarDeepCurrent.resourceType && _xaarDeepCurrent.resourceType!=='NOT_READ') arr.push('H2');
  arr.push('I','J');

function xaarDeepBack(){

async function xaarSubmitDeepening(){
  if(!_xaarCurrent || !_xaarDeepCurrent) return;
  const d = _xaarDeepCurrent;
  const conceptCard = (_xaarConceptCardsAll||[]).find(function(c){return c.id===d.conceptId;});
  const resourceCard = (_xaarResourceCardsAll||[]).find(function(c){return c.id===d.resourceCardId;});
  // 관리자/학생 양쪽 화면 모두 카드 목록을 다시 안 불러와도 바로 표시할 수 있도록,

  d.conceptLabel = d.conceptUnknown ? '아직 모르겠어요' : (conceptCard ? conceptCard.conceptName : '');
  d.resourceCardTitle = resourceCard ? resourceCard.title : '';
  _xaarCurrent.deepening = Object.assign({}, d, { submittedAt: Date.now() });
  try{
    if(FB()) await window._fb.set('xlabAar', _xaarCurrent.id, _xaarCurrent);
  }catch(e){ alert('심화 저장 실패: '+e.message); }
  _xaarDeepStep = 'DEEPRESULT';
  render();
}

// 📓 셀프활동 불러오기 (2026-09-30 신규) — 관리자 요청: "학생별페이지에 위
// 셀프활동을 월별주제활동, 월별교과활동, 최종예상세특 생성시 셀프활동 불러오기를
// 해서 위 내용을 연동해서 보고서나 예상세특에 반영". 세 화면(xlab/xsub/xfin)의
// 편집 화면에서 공통으로 쓰는 팝업 하나로 구현 — 학생이 기록해둔 xlabSelfActivities
// 목록에서 하나를 고르면, 호출한 화면에 맞는 필드에 관련 내용을 채워 넣는다(이미
// 값이 있는 필드는 덮어쓰지 않고 비어있을 때만 채움).
// ══════════════════════════════════════════════════════════════════════════
let _xactPickerFor = null; // null | 'xlab' | 'xsub' | 'xfin'
let _xactPickerList = null;
let _xactPickerLoading = false;

async function xactOpenPicker(context){
  _xactPickerFor = context;
  _xactPickerList = null;
  _xactPickerLoading = true;
  render();
  try{
    const all = await window._fb.getWhere('xlabSelfActivities','studentId','==',String(CU.id));
    _xactPickerList = (all||[]).slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  }catch(e){
    console.warn('셀프활동 불러오기 실패:', e.message);
    _xactPickerList = [];
  }
  _xactPickerLoading = false; render();
}
function xactClosePicker(){ _xactPickerFor=null; _xactPickerList=null; render(); }
function _xactEntryTypeLabel(e){ return e.activityType==='직접입력' ? (e.activityTypeCustom||'직접입력') : (e.activityType||''); }
function _xactEntryFieldLabel(e){
  const detail = e.fieldDetail==='직접입력' ? e.fieldDetailCustom : e.fieldDetail;
  return [e.fieldCategory, detail].filter(Boolean).join(' · ');
}
function _xactEntryMotiveText(e){
  const m = e.motivation||{};
  if(m.type==='subject') return m.subjectConcept||'';
  if(m.type==='reading') return [m.bookTitle&&('「'+m.bookTitle+'」'), m.bookAuthor, m.bookQuestion].filter(Boolean).join(' ');
  if(m.type==='school') return m.schoolQuestion||'';
  return '';
}
function xactPickerHtml(){
  if(!_xactPickerFor) return '';
  const body = _xactPickerLoading ? '<div style="text-align:center;color:#888;padding:30px">불러오는 중...</div>' :
    !(_xactPickerList&&_xactPickerList.length) ? '<div style="text-align:center;color:#aaa;padding:30px;font-size:13px">기록된 월별셀프활동이 없습니다. 먼저 "📓 월별셀프활동"에서 활동을 기록해주세요.</div>' :
    _xactPickerList.map(function(e){
      return `<div onclick="xactApplyToTarget('${e.id}')" style="border:1px solid #eee;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer">
        <div style="font-size:10px;color:#aaa">${_xlabMonthLabel(e.month)} · ${esc(_xactEntryTypeLabel(e))}</div>
        <div style="font-weight:700;font-size:13px;margin-top:2px">${esc(e.interestTopic)||'(관심주제 미입력)'}</div>
        <div style="font-size:11px;color:#888;margin-top:3px">${esc(_xactEntryFieldLabel(e))}</div>
      </div>`;
    }).join('');
  return `<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end" onclick="if(event.target===this) xactClosePicker()">
    <div style="background:#fff;border-radius:16px 16px 0 0;padding:16px;max-height:70vh;overflow-y:auto;width:100%">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:800;font-size:14px">📓 셀프활동 불러오기</span>
        <button onclick="xactClosePicker()" style="background:none;border:none;font-size:18px;color:#888">✕</button>
      </div>
      ${body}
    </div>
  </div>`;
}
function xactApplyToTarget(id){
  const e = (_xactPickerList||[]).find(function(x){return x.id===id;});
  if(!e) return;
  const ctx = _xactPickerFor;
  if(ctx==='xlab' && _xlabCurrent){
    _xlabCaptureFormFields();
    if(!_xlabCurrent.interest) _xlabCurrent.interest = e.interestTopic||'';
    const kw = [_xactEntryMotiveText(e), e.learned].filter(Boolean).join(' / ');
    if(!_xlabCurrent.keywords && kw) _xlabCurrent.keywords = kw;
  } else if(ctx==='xsub' && _xsubCurrent){
    xsubCaptureFormFields();
    if(!_xsubCurrent.topicTitle){
      _xsubCurrent.topicSource = 'manual';
      _xsubCurrent.topicTitle = e.interestTopic || _xactEntryTypeLabel(e) || '셀프활동에서 불러온 주제';
      _xsubCurrent.topicDesc = _xactEntryMotiveText(e) || e.learned || '';
    }
  } else if(ctx==='xfin' && _xfinCurrent){
    xfinCaptureFormFields();
    if(!_xfinCurrent.sections) _xfinCurrent.sections = _xfinBlankSections();
    if(!_xfinCurrent.topicTitle) _xfinCurrent.topicTitle = e.interestTopic||'';
    const motiveText = [e.interestTopic, _xactEntryMotiveText(e)].filter(Boolean).join(' - ');
    if(motiveText && !(_xfinCurrent.sections.motivation&&_xfinCurrent.sections.motivation.text)){
      _xfinCurrent.sections.motivation = {mode:'edit', text: motiveText};
    }
    if(e.learned && !(_xfinCurrent.sections.learned&&_xfinCurrent.sections.learned.text)){
      _xfinCurrent.sections.learned = {mode:'edit', text: e.learned};
    }
    const matchTypes = ['동아리','진로','자율','봉사','실험','탐구','토론','독서'];
    if(matchTypes.indexOf(e.activityType)!==-1){
      if(!_xfinCurrent.linkedActivity) _xfinCurrent.linkedActivity = {types:[],typeCustom:'',mode:'',text:''};
      if(!Array.isArray(_xfinCurrent.linkedActivity.types)) _xfinCurrent.linkedActivity.types=[];
      if(_xfinCurrent.linkedActivity.types.indexOf(e.activityType)===-1) _xfinCurrent.linkedActivity.types.push(e.activityType);
    }
  }
  xactClosePicker();
  toast('셀프활동 내용을 불러왔습니다 📓');
  render();
}

function xclDday(dateStr){
  if(!dateStr) return null;
  const d=new Date(String(dateStr)+'T00:00:00'); if(isNaN(d)) return null;

  return Math.round((d-t)/86400000);
}
function xclDdayLabel(n){ if(n===null) return '미정'; if(n===0) return 'D-DAY'; return n>0?('D-'+n):('D+'+(-n)); }

function xclFmtSize(n){ n=Number(n)||0; if(n>=1073741824) return (n/1073741824).toFixed(1)+'GB'; if(n>=1048576) return (n/1048576).toFixed(1)+'MB'; if(n>=1024) return Math.round(n/1024)+'KB'; return n+'B'; }

function xclAnsReadOnly(secKey, ans){
  const sec=XCL_SECTIONS[secKey]; if(!sec) return '';
  const a=ans||{}; const blocks=[]; const per=sec.per||1;
  for(let i=0;i<per;i++){
    const pre=per>1?('q'+i+'_'):''; let rows='';
    sec.fields.forEach(function(f){
      let v=a[pre+f.k]; if(v==null||v===''||(Array.isArray(v)&&!v.length)) return;
      if(Array.isArray(v)) v=v.join(' · ');
      rows+='<div style="margin:4px 0"><div style="font-size:11px;color:#64748b;font-weight:800">'+xclEsc(f.label)+'</div><div style="font-size:13px;white-space:pre-wrap;background:#f8fafc;border-radius:8px;padding:6px 9px">'+xclEsc(f.type==='score'?(v+'점'):v)+'</div></div>';

}

}
function _xcsCurWeekNo(){

}

function xcsChip(wn,k,key,o,single,max){ const wd=_xcsWd(wn); const cur=(wd.a[k]||{})[key]; let nv;
  if(single) nv=(cur===o)?'':o; else { nv=Array.isArray(cur)?cur.slice():[]; const i=nv.indexOf(o); if(i>=0) nv.splice(i,1); else { if(nv.length>=max) nv.shift(); nv.push(o); } }
  xcsSetVal(wn,k,key,nv); render(); xcsFlush(wn); }
function xcsScore(wn,k,key,n){ const wd=_xcsWd(wn); const cur=(wd.a[k]||{})[key]; xcsSetVal(wn,k,key,Number(cur)===n?'':n); render(); xcsFlush(wn); }
async function xcsFlush(wn){
  const wd=_xcsWd(wn); if(!wd._dirty||!FB()) return; const keys=Object.keys(wd._dirty); wd._dirty={}; const a={};
  keys.forEach(function(k){ a[k]=JSON.parse(JSON.stringify(wd.a[k]||{})); // 배정 문항 원문도 같이 저장(관리자 열람용)
    if(k==='qa'){ (wd.assigned||[]).forEach(function(q,i){ a.qa['q'+i+'_qtext']=q.q; }); } });
  const sv=document.getElementById('xcsSaved');
  try{ await window._fb.set('xlabClassWork',wd.id,{id:wd.id,studentId:String(CU.id),studentName:CU.name||'',w:wn,a:a,updatedAt:Date.now()}); if(sv){ sv.textContent='✅ 저장됨'; } }
  catch(e){ keys.forEach(function(k){ wd._dirty[k]=1; }); if(sv) sv.innerHTML='<span style="color:#dc2626">⚠️ 저장 실패 — 다시 시도해요</span>'; console.warn('워크북 저장 실패',e.message); setTimeout(function(){ xcsFlush(wn); },5000); }
}

function _xcsHint(n,status){
  if(status==='회고완료') return '회고까지 끝났어요 👏';
  if(n===null) return '마감일을 입력하면 해야 할 일을 알려줘요.';
  if(n<0) return n>=-3?'D+3까지: 점수·선생님 피드백을 보고 회고(예상 면접질문 3개)를 써요.':'제출 완료 후 회고를 남겨요.';
  if(n<=3) return '제출 전 체크: 유형별 체크 3가지 셀프체크 → 선생님께 확인 표시.';
  if(n<=5) return '수정(D-5): v2 올리기 — 남은 기호만 확인해요.';
  if(n<=14) return '초안(D-14~D-7): 개요·초안 v1 파일을 올리면 선생님이 기호+질문으로 돌려줘요.';
  if(n<=21) return '계획(D-21): 주제·결과물 형태·내가 할 행동 3줄을 적어 올려요.';
  return '아직 여유가 있어요. D-21이 되면 3줄 계획부터!';
}

function _xcsUploadOne(path,file,onProg){
  return new Promise(function(res,rej){

      const task=st.ref(path).put(file); task.on('state_changed',function(s){ if(onProg) onProg(s.bytesTransferred,s.totalBytes); },rej,function(){ task.snapshot.ref.getDownloadURL().then(res,rej); });
    }catch(e){ rej(e); }
  });
}

function _xpSetPath(d,path,v){ const a=_xpAns(d); const p=path.split('.'); let o=a; for(let i=0;i<p.length-1;i++){ o[p[i]]=o[p[i]]||{}; o=o[p[i]]; } o[p[p.length-1]]=v; }

async function xpFlush(id){
  const d=_xpDocs.find(function(x){return x.id===id;}); if(!d||!FB()) return; clearTimeout(_xpTimer);
  const sv=document.getElementById('xpSaved');
  try{ await window._fb.set('xlabPassageWork',d.id,{id:d.id,studentId:String(CU.id),studentName:CU.name||'',a:JSON.parse(JSON.stringify(d.a||{})),status:d.status||'doing',submittedAt:d.submittedAt||null,updatedAt:Date.now()}); const s2=document.getElementById('xpSaved'); if(s2){ s2.style.color='#16a34a'; s2.textContent='✅ 저장됨'; } }
  catch(e){ const s2=document.getElementById('xpSaved'); if(s2){ s2.style.color='#dc2626'; s2.textContent='⚠️ 저장 실패 — 다시 시도해요'; } console.warn('제시문 저장 실패',e.message); setTimeout(function(){ xpFlush(id); },5000); }

let _xlabTopModeMain = 'topic'; // 'topic' | 'subject' | 'final' | 'self' | 'aar' | 'workbook' | 'mockapply'
function xlabSwitchTopMode(mode){
  _xlabTopModeMain = mode;
  if(mode==='subject'){
    _xsubView='list';
    if(_xsubLoadedForMonth!==_xsubMonth) _xsubLoadList();
  }else if(mode==='final'){
    _xfinView='list';
    if(!_xfinLoaded) _xfinLoadList();
  }else if(mode==='self'){
    _xactView='list';
    if(_xactLoadedForMonth!==_xactMonth) _xactLoadList();
  }else if(mode==='aar'){
    _xaarView='list';
    if(!_xaarLoaded) _xaarLoadAll();
  }else if(mode==='mockapply'){
    _xmapView='list'; _xmapCur=null;
    if(!_xmapLoaded) _xmapLoadList();
  }else if(mode==='workbook'){
    // 워크북 탭은 타입/항목을 고른 뒤에만 데이터를 불러오므로 여기서 미리 로드하지 않음.
  }else{
    _xlabView='list';
  }
  render();
}

      const k=pair[0], label=pair[1];
      const on = _xlabTopModeMain===k;
      return `<button onclick="xlabSwitchTopMode('${k}')" style="flex:1;min-width:96px;padding:10px 6px;border-radius:10px;border:1.5px solid ${on?'#3b5bdb':'#ddd'};background:${on?'#3b5bdb':'#fff'};color:${on?'#fff':'#333'};font-weight:800;font-size:11.5px">${label}</button>`;
    }).join('')}
  </div>`;
}

// ── 입력 모델 갱신(재렌더 없이 값만 반영: 타이핑 중 포커스를 잃지 않게) ──
function xmapSet(path, val){
  if(!_xmapCur) return;
  const parts = path.split('.'); let o=_xmapCur;
  for(let i=0;i<parts.length-1;i++){
    const k = /^\d+$/.test(parts[i]) ? +parts[i] : parts[i];
    if(o[k]==null) o[k] = {};
    o = o[k];
  }
  const last = /^\d+$/.test(parts[parts.length-1]) ? +parts[parts.length-1] : parts[parts.length-1];
  o[last] = val;
}
function xmapPick(path, val){
  // 칩 선택(다시 누르면 해제) — 구조가 바뀌므로 재렌더
  if(!_xmapCur) return;
  const parts = path.split('.'); let o=_xmapCur;
  for(let i=0;i<parts.length-1;i++){ const k=/^\d+$/.test(parts[i])?+parts[i]:parts[i]; o=o[k]; }
  const last = /^\d+$/.test(parts[parts.length-1]) ? +parts[parts.length-1] : parts[parts.length-1];
  o[last] = (o[last]===val) ? '' : val;
  render();
}

// ── 내 성적 스냅샷(저장 시점의 성적을 문서에 고정 — 누적 비교용) ──
function _xmapCaptureGrades(){
  const s = CU||{};
  const csn = s.customSubjNames||{};
  const lab = function(k){ return csn[k]||({korean:'국어',math:'수학',english:'영어',science:'과학',social:'사회'})[k]||k; };
  const subjects = Object.entries(s.subjects||{}).filter(function(p){return p[1]!==null&&p[1]!==undefined&&p[1]!=='';}).map(function(p){ return {label:lab(p[0]), grade:String(p[1])}; });
  const SEMS=['1-1','1-2','2-1','2-2','3-1'];
  const naesin = Object.entries(s.gradeDetail||{}).map(function(p){
    const cells={}; let any=false;
    SEMS.forEach(function(sem){
      const cv=p[1]&&p[1][sem]; const g=fmtGrade(cv); const r=fmtGradeRaw(cv);
      if(g||r){ cells[sem]=(g?String(g):'')+(r?(g?' ('+r+'점)':r+'점'):''); any=true; }
    });
    return any?{subj:p[0], cells:cells}:null;
  }).filter(Boolean);
  const TESTS=['3월모의','5월학평','6월모의','7월학평','9월모의','10월학평','수능'];
  const mock = ['국어','수학','영어','탐구1','탐구2','한국사','제2외국어'].map(function(subj){
    const row=(s.mockGrades||{})[subj]||{}; const cells={}; let any=false;
    TESTS.forEach(function(t){ if(row[t]){ const v=fmtMock(row[t]); if(v&&v!=='–'){cells[t]=v; any=true;} } });
    return any?{subj:subj, cells:cells}:null;
  }).filter(Boolean);
  return {capturedAt:Date.now(), subjects:subjects, naesin:naesin, mock:mock};
}
function xmapLoadGrades(){
  if(!_xmapCur) return;
  _xmapCur.gradeSnapshot = _xmapCaptureGrades();
  const g = _xmapCur.gradeSnapshot;
  if(!g.subjects.length && !g.naesin.length && !g.mock.length) alert('입력된 성적이 없습니다. 📊 성적 탭에서 내신/모의고사 성적을 먼저 입력한 뒤 다시 불러와 주세요.');
  else toast('내 성적을 불러왔습니다 📥');
  render();
}
// ── X-lab 활동 불러오기(주제/교과/최종예상세특/셀프활동 제목을 활동 목록으로) ──
async function xmapImportXlab(){
  if(!_xmapCur || !FB()) return;
  if(_xmapImp && !_xmapImp.loading){ _xmapImp=null; render(); return; } // 다시 누르면 닫기
  _xmapImp = {loading:true, items:[]}; render();
  try{
    const [topics, subs, fins, selfs] = await Promise.all([
      window._fb.getWhere('xlabTopics','studentId','==',String(CU.id)),
      window._fb.getWhere('xlabSubjectReports','studentId','==',String(CU.id)),
      window._fb.getWhere('xlabFinalRecords','studentId','==',String(CU.id)),
      window._fb.getWhere('xlabSelfActivities','studentId','==',String(CU.id)),
    ]);
    const have = {}; (_xmapCur.activities||[]).forEach(function(a){ if(a.src) have[a.src]=1; });
    const items = [];
    const push = function(src, label, area, subject, content, keyword, ts){
      if(!content) return;
      items.push({src:src,label:label,area:area,subject:subject||'',content:content,keyword:keyword||'',have:!!have[src],checked:false,ts:ts||0});
    };
    (topics||[]).forEach(function(t){ push('topic:'+t.id,'월별주제활동','X-lab 탐구',t.subjectArea||'',t.topicTitle,t.department||'',t.createdAt); });
    (subs||[]).forEach(function(t){ push('subject:'+t.id,'월별교과활동','교과 세특',t.subjectArea||t.subject||'',t.topicTitle,'',t.createdAt); });
    (fins||[]).forEach(function(t){ push('final:'+t.id,'최종예상세특','교과 세특',t.subjectArea||t.subject||'',t.topicTitle,'',t.createdAt); });
    (selfs||[]).forEach(function(t){ push('self:'+t.id,'월별셀프활동','기타','',t.interestTopic,t.fieldCategory||'',t.createdAt); });
    items.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
    _xmapImp = {loading:false, items:items};
  }catch(e){ _xmapImp=null; alert('불러오기 실패: '+e.message); }
  render();
}
function xmapImpToggle(i){ if(_xmapImp && _xmapImp.items[i] && !_xmapImp.items[i].have) _xmapImp.items[i].checked = !_xmapImp.items[i].checked; render(); }
function xmapImpAll(on){ if(_xmapImp) _xmapImp.items.forEach(function(it){ if(!it.have) it.checked=!!on; }); render(); }
function xmapImpApply(){
  if(!_xmapImp || !_xmapCur) return;
  let added=0;
  _xmapImp.items.forEach(function(it){
    if(it.checked && !it.have){ _xmapCur.activities.push({area:it.area,subject:it.subject,content:it.content,keyword:it.keyword,status:'완료',src:it.src}); added++; }
  });
  if(!added){ alert('등록할 활동을 먼저 선택해 주세요.'); return; }
  _xmapImp = null; toast('X-lab 활동 '+added+'건을 등록했습니다 📥'); render();
}

    +'<button onclick="xmapImpApply()" style="flex:2;padding:10px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:12.5px">선택한 '+sel+'건 등록</button></div></div>';

async function xmapSave(){

  if(!d.period){ alert('기준월을 선택해 주세요.'); return; }

  d.studentName = CU.name||''; d.studentSchool = CU.school||''; d.studentGrade = CU.grade||'';
  d.updatedAt = Date.now();

  const half = d.apps.findIndex(function(a){ return (a.univ||'').trim() && !(a.dept||'').trim(); });
  if(half>=0 && !confirm((half+1)+'번 칸에 학과가 비어 있습니다. 그대로 저장할까요?')) return;
  _xmapSaving = true;
  try{
    if(FB()) await window._fb.set('xlabMockApply', d.id, d);

    if(d.profile && d.profile.dept && !CU.xlabDepartment){
      try{ await window._fb.set('students',CU.id,{xlabDepartment:d.profile.dept}); CU.xlabDepartment=d.profile.dept; }catch(e){}

  }catch(e){
    _xmapSaving=false;
    const msg = String(e&&e.message||e);
    if(/permission/i.test(msg)) alert('저장 권한 오류입니다. 입력한 내용이 부족해서가 아니라, 서버(Firestore) 보안규칙에 모의수시지원 저장 공간(xlabMockApply)이 아직 열려 있지 않아서 생기는 오류입니다.\n\n관리자에게 이 화면을 알려 주세요. (입력한 내용은 이 화면에 그대로 남아 있습니다)');
    else alert('저장 실패: '+msg);
  }
}

function renderXlab(){

  if(_xlabTopModeMain==='xperf') return renderXperfStu();
  if(_xlabTopModeMain==='subject') return renderXsub();
  if(_xlabTopModeMain==='final') return renderXfin();

  if(_xlabTopModeMain==='aar') return renderXaar();
  if(_xlabView==='edit' && _xlabCurrent) return renderXlabEdit();

// 📓 X-lab · 월별워크북 (학생용 디지털 워크북, 2026-10-02 신규)
// 관리자 파일의 "🖨 워크북 인쇄/PDF"(종이 워크북)와 짝을 이루는 디지털판 — 학생이
// 월별주제활동/월별교과활동/최종예상세특 중 하나를 고르고, 그 항목을 고른 뒤, 각
// 단계별로(관리자의 _xlabBuildWorkbookHtml/_xsubBuildWorkbookHtml/_xfinBuildWorkbookHtml
// 와 동일한 단계 구성) 참고자료를 보며 직접 입력해 저장한다. 저장한 답은 해당 문서의
// workbookAnswers 필드(스텝키→텍스트)에 들어가며, 관리자 파일의 "👤 학생워크북" 인쇄
// 버튼(_xlabBuildStudentWorkbookHtml 등)이 이 필드를 그대로 읽어 인쇄한다.
// ── 스텝키 규칙(관리자 파일과 반드시 동일하게 유지) ─────────────────────────
//   · topic(xlabTopics): step1~step7 (관리자 _xlabWorksheetStep의 no 문자열 그대로)
//   · subject(xlabSubjectReports): step0~step7 (step5=독서활동, 저장된 독서활동 자료가
//     있을 때만 등장 — 관리자 쪽과 동일 조건)
//   · final(xlabFinalRecords): 동적 번호 대신 섹션의 고유 키를 그대로 사용
//     (motivation/concept/example/issue/learned/reading), + linkedActivity, + finalPolish
// ══════════════════════════════════════════════════════════════════════════

// 관리자 파일의 _xlabBuildWorkbookHtml / _xsubBuildWorkbookHtml / _xfinBuildWorkbookHtml와
// 1:1로 대응하는 단계 스키마. {key, no, title, refLabel, refText, blankLabel} 배열을 반환.
function _xwbStepsFor(type, item){
  if(type==='topic'){
    return [
      {key:'step1', no:'1', title:'주제 선정이유', refLabel:'지난 시간에 정리한 이유', refText:(item.report&&item.report.reason)||'', blankLabel:'오늘 다시 한 번, 이 주제를 고른 이유를 적어보세요'},
      {key:'step2', no:'2', title:'개념·원리·이론', refLabel:'저장된 내용', refText:(item.report&&item.report.concept)||'', blankLabel:'이 주제와 관련된 개념·원리·이론을 정리해보세요'},
      {key:'step3', no:'3', title:'실사례', refLabel:'저장된 내용', refText:(item.report&&item.report.example)||'', blankLabel:'실제 사례나 예시를 찾아 적어보세요'},
      {key:'step4', no:'4', title:'문제점·개선점', refLabel:'저장된 내용', refText:(item.report&&item.report.issue)||'', blankLabel:'문제점과 개선 아이디어를 적어보세요'},
      {key:'step5', no:'5', title:'학교 연계 활동', refLabel:'저장된 내용', refText:(item.report&&item.report.activity)||'', blankLabel:'학교에서 연계해볼 수 있는 활동을 적어보세요'},
      {key:'step6', no:'6', title:'🤖 심화·확장 주제', refLabel:'AI 추천 심화·확장 주제', refText: item.advancedTopicTitle ? (item.advancedTopicTitle+(item.advancedTopicDesc?(' — '+item.advancedTopicDesc):'')) : '', blankLabel:'AI 추천을 참고해서 내가 더 파고들고 싶은 부분을 적어보세요'},
      {key:'step7', no:'7', title:'예상세특 확인', refLabel:'저장된 예상세특'+(item.expectedRecord&&item.expectedRecord.subject?(' ('+item.expectedRecord.subject+')'):''), refText:(item.expectedRecord&&item.expectedRecord.recordText)||'', blankLabel:'더 다듬고 싶은 표현이나 보완할 점을 메모해보세요'}
    ];
  }
  if(type==='subject'){
    const reasonLine = _xsubReasonSummaryText(item.reason||{});
    const steps = [
      {key:'step0', no:'0', title:'탐구 계기', refLabel:'저장된 계기', refText:reasonLine||'', blankLabel:'이 주제가 궁금해진 계기를 내 말로 다시 적어보세요'},
      {key:'step1', no:'1', title:'개념·원리·이론', refLabel:'저장된 내용', refText:(item.report&&item.report.concept)||'', blankLabel:'관련된 개념·원리·이론을 정리해보세요'},
      {key:'step2', no:'2', title:'실사례', refLabel:'저장된 내용', refText:(item.report&&item.report.example)||'', blankLabel:'실제 사례나 예시를 찾아 적어보세요'},
      {key:'step3', no:'3', title:'문제점·개선점', refLabel:'저장된 내용', refText:(item.report&&item.report.issue)||'', blankLabel:'문제점과 개선 아이디어를 적어보세요'},
      {key:'step4', no:'4', title:'배운점·느낀점', refLabel:'저장된 내용', refText:(item.report&&item.report.learned)||'', blankLabel:'배우고 느낀 점을 적어보세요'}
    ];
    if(item.report && item.report.reading){
      steps.push({key:'step5', no:'5', title:'독서활동 기록', refLabel:'저장된 내용', refText:item.report.reading, blankLabel:'독서활동과 연결해서 더 적어볼 내용이 있다면 적어보세요'});
    }
    steps.push({key:'step6', no:'6', title:'🤖 심화·확장 주제', refLabel:'AI 추천/저장된 심화·확장 주제', refText:(item.report&&item.report.advanced)||'', blankLabel:'AI 추천을 참고해서 더 파고들고 싶은 부분을 적어보세요'});
    steps.push({key:'step7', no:'7', title:'교과 예상세특 확인', refLabel:'저장된 예상세특'+(item.expectedRecord&&item.expectedRecord.subject?(' ('+item.expectedRecord.subject+')'):''), refText:(item.expectedRecord&&item.expectedRecord.recordText)||'', blankLabel:'더 다듬고 싶은 표현이나 보완할 점을 메모해보세요'});
    return steps;
  }
  if(type==='final'){
    const sectionLabels = [['motivation','주제 선정동기'],['concept','개념·원리·이론'],['example','실사례'],['issue','문제점·개선점'],['learned','배운점·느낀점·알게된점'],['reading','독서활동']];
    let stepNo=1, steps=[];
    sectionLabels.forEach(function(pair){
      const sec = item.sections && item.sections[pair[0]];
      if(!sec || sec.mode==='none' || !sec.text) return;
      steps.push({key:pair[0], no:String(stepNo++), title:pair[1], refLabel:'저장된 내용', refText:sec.text, blankLabel:'내 말로 다시 정리해서 적어보세요'});
    });
    const laText = (item.linkedActivity && item.linkedActivity.mode!=='none') ? item.linkedActivity.text : '';
    if(laText){
      steps.push({key:'linkedActivity', no:String(stepNo++), title:'연계 활동 ('+_xfinResolvedLinkedType(item)+')', refLabel:'저장된 내용', refText:laText, blankLabel:'이 활동과 어떻게 연결되는지 적어보세요'});
    }
    steps.push({key:'finalPolish', no:String(stepNo++), title:'최종 다듬기', refLabel:'', refText:'', blankLabel:'위 내용을 참고해서, 최종예상세특에서 더 다듬고 싶은 표현이나 추가하고 싶은 내용을 적어보세요'});
    return steps;
  }
  return [];
}

async function xwbSave(){
  if(!_xwbCurrent || !_xwbType) return;
  const coll = XWB_COLLECTIONS[_xwbType];
  const steps = _xwbStepsFor(_xwbType, _xwbCurrent);
  const wa = Object.assign({}, _xwbCurrent.workbookAnswers||{});
  steps.forEach(function(st){
    const el = document.getElementById('xwbAns_'+st.key);
    if(el) wa[st.key] = el.value;
  });
  _xwbSaving = true; render();
  try{
    if(FB()) await window._fb.set(coll, _xwbCurrent.id, Object.assign({}, _xwbCurrent, {workbookAnswers: wa, workbookSavedAt: Date.now()}));
    _xwbCurrent.workbookAnswers = wa;
    _xwbCurrent.workbookSavedAt = Date.now();
    toast('워크북이 저장되었습니다 💾');
  }catch(e){
    alert('저장 실패: '+e.message);
  }
  _xwbSaving = false; render();
}

        <input id="xlabManualTitle" placeholder="관심주제를 입력하세요" style="margin:6px 0 10px">
        ${renderXlabSubjectFields()}
        <label style="font-size:12px;color:#666;font-weight:700">간단한 설명 <span style="color:#aaa;font-weight:400">(선택)</span></label>
        <textarea id="xlabManualDesc" rows="3" style="margin:6px 0 10px"></textarea>
        <button onclick="xlabSetManualTopic()" style="width:100%;padding:12px;background:#3b5bdb;color:#fff;border:none;border-radius:10px;font-weight:800">주제 확정</button>
      `}
    </div>` : `
    <div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-size:12px;color:#888">${t.topicSource==='ai'?'🤖 AI추천':'✍️ 직접입력'} · 희망학과: ${t.department||''}</div>
      <div style="font-weight:800;font-size:15px;margin-top:4px">${t.topicTitle}</div>
      <div style="font-size:12px;color:#666;margin-top:6px">${t.topicDesc||''}</div>
      ${(t.subjectArea||t.subjectConcept) ? `<div style="font-size:11px;color:#0f766e;margin-top:6px;background:#0f766e0f;border-radius:8px;padding:6px 8px">${t.subjectArea?('📘 교과목: '+t.subjectArea):''}${(t.subjectArea&&t.subjectConcept)?' · ':''}${t.subjectConcept?('교과개념: '+t.subjectConcept):''}</div>` : ''}
      ${t.difficultyLevel ? `<div style="font-size:11px;color:#f08c00;margin-top:6px;background:#f08c000f;border-radius:8px;padding:6px 8px">🎯 난이도: ${(XLAB_DIFFICULTY_OPTS.find(function(o){return o.key===t.difficultyLevel;})||{label:t.difficultyLevel}).label}</div>` : ''}
      ${!(t.report&&t.report.savedAt) ? `<button onclick="xlabResetTopic()" style="margin-top:10px;background:none;border:none;color:#3b5bdb;font-size:12px;font-weight:700">주제 다시 선택</button>` : ''}
    </div>

    <div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:800;font-size:14px">📘 주제탐구 보고서</span>
        ${(t.report&&t.report.savedAt) ? `<button onclick="xlabPrintReport()" style="padding:7px 14px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px">🖨 인쇄/PDF</button>` : ''}
      </div>
      <div style="font-size:11px;color:#888;margin-bottom:10px">항목별로 "🤖 AI로 생성" 버튼을 눌러 내용을 만들고, 필요하면 직접 내용을 고치거나 덧붙이세요.</div>
      ${XLAB_REPORT_FIELDS.map(function(pair){
        const f=pair[0], label=pair[1];
        const val = (t.report && t.report[f]) || '';
        const loading = !!_xlabReportLoading[f];
        const btnColor = XLAB_REPORT_FIELD_COLORS[f] || '#0f766e';
        return `
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid #f1f1f1">
          <label style="font-size:12px;color:#333;font-weight:800">${label} <span style="color:#e03131;font-weight:400">(필수)</span></label>
          <button onclick="xlabGenerateReportSection('${f}')" ${loading?'disabled':''} style="width:100%;padding:12px;background:${btnColor};color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:8px">${loading?'⏳ 생성 중...':(val?('🔄 '+label+' 다시 생성'):('🤖 '+label+' (필수)'))}</button>
          <textarea id="xlabReport_${f}" rows="3" placeholder="AI로 생성하거나 직접 입력하세요" style="margin-top:8px;font-size:13px">${String(val).replace(/</g,'&lt;')}</textarea>
        </div>
      `;}).join('')}
      ${renderXlabAdvancedTopicBlock(t)}
      <button onclick="xlabSaveTopic()" style="width:100%;padding:12px;background:#3b5bdb;color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:8px">💾 보고서 저장</button>
    </div>

    ${(t.report&&t.report.savedAt) ? `
    <div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:800;font-size:14px">📝 예상 세특</span>
        ${!t.expectedRecord ? `<button onclick="xlabOpenRecordWizard()" style="padding:7px 14px;background:#0f766e;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px">🤖 예상세특 생성</button>`
        : `<div style="display:flex;gap:6px"><button onclick="xlabOpenRecordWizard()" style="padding:7px 12px;background:#3b5bdb18;color:#3b5bdb;border:none;border-radius:8px;font-weight:700;font-size:12px">🔄 다시생성</button><button onclick="xlabPrintRecord()" style="padding:7px 12px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:12px">🖨 인쇄/PDF</button></div>`}
      </div>
      ${t.expectedRecord ? `
        <div style="font-size:11px;color:#888;margin-bottom:6px">과목: ${t.expectedRecord.subject||''} · 동기: ${t.expectedRecord.motivation||''}</div>
        <textarea id="xlabRecordText" rows="6" maxlength="500" oninput="document.getElementById('xlabRecordCount').textContent=this.value.length" style="font-size:13px">${String(t.expectedRecord.recordText||'').replace(/</g,'&lt;')}</textarea>
        <div style="text-align:right;font-size:11px;color:#999;margin:4px 0 10px"><span id="xlabRecordCount">${String(t.expectedRecord.recordText||'').length}</span>/500자</div>
        <button onclick="xlabSaveRecord()" style="width:100%;padding:12px;background:#3b5bdb;color:#fff;border:none;border-radius:10px;font-weight:800">💾 예상세특 저장</button>
      ` : '<div style="text-align:center;color:#aaa;font-size:12px;padding:20px">아직 예상세특이 생성되지 않았습니다.</div>'}
    </div>` : ''}
    `}
  </div>
  ${_xlabRecordWizardStep>0 ? renderXlabRecordWizard() : ''}
  ${xactPickerHtml()}`;
}

function renderXlabRecordWizard(){
  const step = _xlabRecordWizardStep;
  const c = _xlabRecordChoice;
  const stepDef = {
    1:{title:'과목 선택',field:'subject',opts:XLAB_SUBJECT_CATS,customId:'xlabSubjectCustom'},
    2:{title:'동기 선택',field:'motivation',opts:XLAB_MOTIVATION_OPTS,customId:'xlabMotivationCustom'},
    3:{title:'관련 활동 선택',field:'relatedActivity',opts:XLAB_ACTIVITY_OPTS,customId:'xlabRelatedCustom'},
    4:{title:'연계 활동 선택 (선택사항)',field:'linkedActivity',opts:XLAB_ACTIVITY_OPTS,customId:'xlabLinkedCustom'},
  }[step];
  return `
  <div style="position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:999" onclick="if(event.target===this)xlabCloseRecordWizard()">
    <div style="background:#fff;width:100%;border-radius:18px 18px 0 0;padding:20px;max-height:80vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="font-weight:800;font-size:15px">${step}/4 · ${stepDef.title}</span>
        <button onclick="xlabCloseRecordWizard()" style="background:none;border:none;font-size:18px">✕</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
        ${stepDef.opts.map(function(o){return `<button onclick="xlabWizardChoose('${stepDef.field}','${o}')" style="padding:9px 14px;border-radius:20px;border:1.5px solid ${c[stepDef.field]===o?'#3b5bdb':'#ddd'};background:${c[stepDef.field]===o?'#3b5bdb':'#fff'};color:${c[stepDef.field]===o?'#fff':'#333'};font-weight:700;font-size:12px">${o}</button>`;}).join('')}
      </div>
      ${c[stepDef.field]==='직접입력' ? `<input id="${stepDef.customId}" placeholder="직접 입력" value="${(c[stepDef.field+'Custom']||'').replace(/"/g,'&quot;')}" style="margin-bottom:12px">` : ''}
      <div style="display:flex;gap:8px;margin-top:16px">
        ${step>1 ? `<button onclick="xlabWizardPrev()" style="flex:1;padding:12px;background:#f1f3f8;border:none;border-radius:10px;font-weight:700">이전</button>` : ''}
        ${step===4 ? `<button onclick="xlabWizardSkipLinked()" style="flex:1;padding:12px;background:#f1f3f8;border:none;border-radius:10px;font-weight:700">건너뛰기</button>` : ''}
        <button onclick="${step===4?'xlabWizardFinishLinked()':'xlabWizardNext()'}" ${_xlabRecordLoading?'disabled':''} style="flex:2;padding:12px;background:#0f766e;color:#fff;border:none;border-radius:10px;font-weight:800">${_xlabRecordLoading?'⏳ 생성 중...':(step===4?'🤖 AI 예상세특 생성':'다음')}</button>
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════════════
// 📗 X-lab — 월별교과활동 (학생용, 2026-09-28 신규)
// 관리자 요청 스펙: 교과목(국어/영어/수학/사회/과학/역사/직접입력) + 희망학과 입력 →
// 탐구 주제를 "기존 월별주제활동 목록에서 선택" / "직접입력" / "AI 주제추천" 중 하나로
// 선정 → 주제 선정이유/알게 된 계기를 4가지 유형(수업시간/독서활동/교내활동/직접입력)
// 중 하나로 구조화해서 입력 → 6개 항목(개념·원리·이론/실사례/문제점·개선점/
// 배운점·느낀점·알게된점/독서활동 기록/심화·확장주제)을 AI추천 또는 직접입력으로 작성 →
// 저장/수정/인쇄·PDF → 교과 예상세특(500자) 버튼 생성.
// 저장 위치: 신규 컬렉션 xlabSubjectReports(학생ID+월 단위 문서).
// ⚠️ Firestore 보안규칙에 'xlabSubjectReports' 컬렉션이 xlabTopics와 같은 방식으로
// (allow read, write: if true) 추가되어 있어야 정상 동작합니다.
// ══════════════════════════════════════════════════════════════════════════
const XSUB_SCHOOL_ACTIVITY_TYPES = ['동아리','진로','자율','봉사','실험','탐구','토론','강연','독서','직접입력'];
const XSUB_REPORT_FIELDS = [
  ['concept','① 개념·원리·이론'],
  ['example','② 실사례 예시'],
  ['issue','③ 문제점·개선점'],
  ['learned','④ 배운점·느낀점·알게된점'],
  ['reading','⑤ 독서활동 기록'],
  ['advanced','⑥ 심화·확장주제'],
];
const XSUB_REPORT_FIELD_COLORS = {concept:'#5fae7a', example:'#d99a4e', issue:'#d9738c', learned:'#6c8ee2', reading:'#8f7fe0', advanced:'#3bb6c9'};

let _xsubMonth = (function(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
let _xsubList = [];
let _xsubLoading = false;
let _xsubLoadedForMonth = null;
let _xsubView = 'list'; // 'list' | 'edit'
let _xsubCurrent = null;
let _xsubTopicMode = 'existing'; // 'existing' | 'ai' | 'manual'
let _xsubAiCandidates = null;
let _xsubAiLoading = false;
let _xsubExistingTopics = null; // 학생의 xlabTopics 캐시("기존 목록에서 선택"용)
let _xsubReportLoading = {};
let _xsubRecordLoading = false;

async function _xsubLoadList(){
  if(!FB() || !CU) return;
  const loadedMonth = _xsubMonth;
  _xsubLoading = true; render();
  try{
    const all = await window._fb.getWhere('xlabSubjectReports','studentId','==',String(CU.id));
    _xsubList = (all||[]).filter(t=>t.month===loadedMonth).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }catch(e){
    console.warn('X-lab 교과활동 목록 로딩 실패:', e.message);
    _xsubList = [];
  }
  _xsubLoadedForMonth = loadedMonth;
  _xsubLoading = false; render();
}

function xsubChangeMonth(m){
  _xsubMonth = m; _xsubView='list'; _xsubCurrent=null;
  _xsubLoadList();
}

async function _xsubEnsureExistingTopics(){
  if(_xsubExistingTopics!==null) return;
  if(!FB() || !CU) return;
  try{
    const all = await window._fb.getWhere('xlabTopics','studentId','==',String(CU.id));
    _xsubExistingTopics = (all||[]).filter(t=>t.topicTitle).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }catch(e){ _xsubExistingTopics = []; }
  render();
}

function xsubNewActivity(){
  _xsubCurrent = {
    id: 'xsub_'+CU.id+'_'+Date.now(),
    studentId: String(CU.id),
    studentName: CU.name||'',
    studentSchool: CU.school||'',
    studentGrade: CU.grade||'',
    month: _xsubMonth,
    department: CU.xlabDepartment||'',
    subjectArea:'', subjectAreaCustom:'',
    topicSource: 'existing',
    topicTitle:'', topicDesc:'', linkedXlabTopicId:'',
    reason: {type:''},
    report: {concept:'',example:'',issue:'',learned:'',reading:'',advanced:''},
    expectedRecord: null,
    createdAt: Date.now(),
  };
  _xsubTopicMode = 'existing';
  _xsubAiCandidates = null;
  _xsubView = 'edit';
  render();
  _xsubEnsureExistingTopics();
}

function xsubOpenExisting(id){
  const t = _xsubList.find(x=>x.id===id);
  if(!t) return;
  _xsubCurrent = t;
  if(!_xsubCurrent.reason) _xsubCurrent.reason = {type:''};
  if(!_xsubCurrent.report) _xsubCurrent.report = {concept:'',example:'',issue:'',learned:'',reading:'',advanced:''};
  _xsubTopicMode = t.topicSource||'existing';
  _xsubAiCandidates = null;
  _xsubView = 'edit';
  render();
  if(_xsubTopicMode==='existing' && !t.topicTitle) _xsubEnsureExistingTopics();
}

function xsubBackToList(){ _xsubView='list'; _xsubCurrent=null; render(); }

function xsubResetTopic(){
  if(_xsubCurrent.report && _xsubCurrent.report.savedAt){
    if(!confirm('이미 저장된 보고서입니다. 주제를 다시 선택해도 아래 작성된 항목 내용은 그대로 남아있습니다. 계속할까요?')) return;
  }
  _xsubCurrent.topicTitle=''; _xsubCurrent.topicDesc=''; _xsubCurrent.linkedXlabTopicId='';
  _xsubAiCandidates = null;
  render();
}

// 화면이 다시 그려지기 전에 현재 입력 중인 값들을 모두 _xsubCurrent에 반영 — X-lab
// 월별주제활동의 _xlabCaptureFormFields()와 동일한 이유(칩 클릭 등으로 render()가
// 다시 호출되면서 입력 중이던 텍스트 값이 사라지는 것을 방지)로 존재한다.
function xsubCaptureFormFields(){
  if(!_xsubCurrent) return;
  const map = {
    xsubDeptInput:'department',
    xsubSubjectAreaCustom:'subjectAreaCustom',
    xsubInterestInput:'_interestDraft',
    xsubManualTitle:'_manualTitleDraft',
    xsubManualDesc:'_manualDescDraft',
  };
  Object.keys(map).forEach(function(id){
    const el = document.getElementById(id);
    if(el) _xsubCurrent[map[id]] = el.value;
  });
  if(!_xsubCurrent.reason) _xsubCurrent.reason = {type:''};
  const reasonMap = {
    xsubReasonClassSubject:'classSubject', xsubReasonClassConcept:'classConcept',
    xsubReasonBookTitle:'bookTitle', xsubReasonBookAuthor:'bookAuthor', xsubReasonBookCuriosity:'bookCuriosity',
    xsubReasonActivityTypeCustom:'activityTypeCustom', xsubReasonActivityName:'activityName', xsubReasonActivityCuriosity:'activityCuriosity',
    xsubReasonManualText:'manualText',
  };
  Object.keys(reasonMap).forEach(function(id){
    const el = document.getElementById(id);
    if(el) _xsubCurrent.reason[reasonMap[id]] = el.value;
  });
}

function xsubChooseSubjectArea(v){
  if(_xsubCurrent.topicTitle) return; // 주제 확정 후에는 교과목 변경 불가(보고서 내용과 어긋나지 않도록)
  xsubCaptureFormFields();
  _xsubCurrent.subjectArea = v;
  if(v!=='직접입력') _xsubCurrent.subjectAreaCustom='';
  render();
}

function _xsubResolvedSubjectArea(t){
  if(!t) return '';
  return (t.subjectArea==='직접입력') ? (t.subjectAreaCustom||'').trim() : (t.subjectArea||'');
}

function xsubChooseTopicMode(mode){
  xsubCaptureFormFields();
  _xsubTopicMode = mode;
  if(mode==='existing') _xsubEnsureExistingTopics();
  render();
}

function xsubSelectExistingTopic(id){
  const t = (_xsubExistingTopics||[]).find(x=>x.id===id);
  if(!t) return;
  xsubCaptureFormFields();
  _xsubCurrent.topicSource = 'existing';
  _xsubCurrent.linkedXlabTopicId = t.id;
  _xsubCurrent.topicTitle = t.topicTitle;
  _xsubCurrent.topicDesc = t.topicDesc||'';
  if(!_xsubCurrent.department) _xsubCurrent.department = t.department||CU.xlabDepartment||'';
  render();
}

async function xsubFindAiTopics(){
  xsubCaptureFormFields();
  const dept = (_xsubCurrent.department||'').trim() || CU.xlabDepartment || '';
  const interest = (_xsubCurrent._interestDraft||'').trim();
  if(!dept){ alert('희망학과를 먼저 입력해주세요.'); return; }
  _xsubCurrent.department = dept;
  _xsubAiLoading = true; render();
  try{
    const r = await window._fb.xlabRecommendTopics({department:dept, interest:interest, keywords:'', difficultyLevel:_xlabDefaultDifficulty(), grade:CU.grade||''});
    _xsubAiCandidates = r.topics||[];
  }catch(e){
    alert('주제 추천 중 오류가 발생했습니다: '+e.message);
    _xsubAiCandidates = [];
  }
  _xsubAiLoading = false; render();
}

function xsubSelectAiTopic(idx){
  const t = _xsubAiCandidates[idx];
  if(!t) return;
  xsubCaptureFormFields();
  _xsubCurrent.topicSource = 'ai';
  _xsubCurrent.linkedXlabTopicId = '';
  _xsubCurrent.topicTitle = t.title;
  _xsubCurrent.topicDesc = t.desc;
  render();
}

function xsubSetManualTopic(){
  const titleEl = document.getElementById('xsubManualTitle');
  const descEl = document.getElementById('xsubManualDesc');
  const title = titleEl ? titleEl.value.trim() : '';
  const desc = descEl ? descEl.value.trim() : '';
  if(!title){ alert('탐구 주제를 입력해주세요.'); return; }
  xsubCaptureFormFields();
  _xsubCurrent.topicSource = 'manual';
  _xsubCurrent.linkedXlabTopicId = '';
  _xsubCurrent.topicTitle = title;
  _xsubCurrent.topicDesc = desc;
  render();
}

function xsubChooseReasonType(type){
  xsubCaptureFormFields();
  if(!_xsubCurrent.reason) _xsubCurrent.reason = {};
  _xsubCurrent.reason.type = type;
  render();
}

function xsubChooseActivityType(v){
  xsubCaptureFormFields();
  _xsubCurrent.reason.activityType = v;
  if(v!=='직접입력') _xsubCurrent.reason.activityTypeCustom='';
  render();
}

function _xsubReasonSummaryText(r){
  if(!r || !r.type) return '';
  if(r.type==='class') return '📚 수업시간('+(r.classSubject||'')+') 중 궁금증: '+(r.classConcept||'');
  if(r.type==='reading') return '📖 독서활동("'+(r.bookTitle||'')+'"'+(r.bookAuthor?(' · '+r.bookAuthor):'')+') 중 궁금증: '+(r.bookCuriosity||'');
  if(r.type==='schoolActivity') return '🏫 교내활동('+(r.activityType==='직접입력'?(r.activityTypeCustom||''):(r.activityType||''))+(r.activityName?(' · '+r.activityName):'')+') 중 궁금증: '+(r.activityCuriosity||'');
  if(r.type==='manual') return r.manualText||'';
  return '';
}

function renderXsubReasonBlock(t){
  const r = t.reason || {};
  const opts = [
    {key:'class', label:'📚 수업시간에 궁금증이 생김'},
    {key:'reading', label:'📖 독서활동 중 궁금증이 생김'},
    {key:'schoolActivity', label:'🏫 교내활동 중 궁금증이 생김'},
    {key:'manual', label:'✍️ 직접입력'},
  ];
  let sub = '';
  if(r.type==='class'){
    sub = `

async function xsubGenerateReportSection(field){
  if(!_xsubCurrent.topicTitle){ alert('먼저 주제를 선택하거나 입력해주세요.'); return; }
  if(!_xsubResolvedSubjectArea(_xsubCurrent)){ alert('교과목을 먼저 선택해주세요.'); return; }
  if(!_xsubCurrent.reason || !_xsubCurrent.reason.type){ alert('먼저 "주제 선정이유 / 알게 된 계기"를 선택·입력해주세요.'); return; }
  if(!_xsubCurrent.report) _xsubCurrent.report = {concept:'',example:'',issue:'',learned:'',reading:'',advanced:''};
  XSUB_REPORT_FIELDS.forEach(function(pair){
    const el = document.getElementById('xsubReport_'+pair[0]);
    if(el) _xsubCurrent.report[pair[0]] = el.value;
  });
  xsubCaptureFormFields();
  _xsubReportLoading[field] = true; render();
  try{
    const r = await window._fb.xlabGenerateSubjectSection({
      department: _xsubCurrent.department||'',
      subjectArea: _xsubResolvedSubjectArea(_xsubCurrent),
      topic: _xsubCurrent.topicTitle,
      topicDesc: _xsubCurrent.topicDesc||'',
      section: field,
      reason: _xsubCurrent.reason||{},
      grade: CU.grade||'',
    });
    _xsubCurrent.report[field] = r.text;
    _xsubCurrent.report.generatedAt = Date.now();
  }catch(e){
    alert('AI 생성 중 오류가 발생했습니다: '+e.message);
  }
  _xsubReportLoading[field] = false; render();
}

async function xsubSaveActivity(){
  if(!_xsubCurrent.topicTitle){ alert('저장할 주제 내용이 없습니다.'); return; }
  const subjArea = _xsubResolvedSubjectArea(_xsubCurrent);
  if(!subjArea){ alert('교과목을 선택해주세요.'); return; }
  if(!_xsubCurrent.reason || !_xsubCurrent.reason.type){ alert('"주제 선정이유 / 알게 된 계기"는 필수입니다.'); return; }
  _xsubCurrent.studentName = CU.name||'';
  _xsubCurrent.studentSchool = CU.school||'';
  _xsubCurrent.studentGrade = CU.grade||'';
  if(!_xsubCurrent.report) _xsubCurrent.report = {concept:'',example:'',issue:'',learned:'',reading:'',advanced:''};
  XSUB_REPORT_FIELDS.forEach(function(pair){
    const el = document.getElementById('xsubReport_'+pair[0]);
    if(el) _xsubCurrent.report[pair[0]] = el.value;
  });
  for(const pair of XSUB_REPORT_FIELDS){
    const f = pair[0], label = pair[1];
    if(!String(_xsubCurrent.report[f]||'').trim()){
      alert('"'+label+'" 항목은 필수 입력입니다. AI로 생성하거나 직접 입력해주세요.');
      return;
    }
  }
  _xsubCurrent.report.savedAt = Date.now();
  try{
    if(FB()) await window._fb.set('xlabSubjectReports', _xsubCurrent.id, _xsubCurrent);
    toast('저장되었습니다 💾');
    await _xsubLoadList();
    _xsubView='list'; _xsubCurrent=null; render();
  }catch(e){ alert('저장 실패: '+e.message); }
}

function xsubDeleteActivity(id){
  if(!confirm('이 교과활동 보고서를 삭제하시겠습니까?')) return;
  (async function(){
    try{
      if(FB()) await window._db.collection('xlabSubjectReports').doc(id).delete();
      toast('삭제되었습니다');
      await _xsubLoadList();
    }catch(e){ alert('삭제 실패: '+e.message); }
  })();
}

async function xsubGenerateRecord(){
  if(!_xsubCurrent || !_xsubCurrent.report || !_xsubCurrent.report.savedAt){ alert('먼저 보고서를 저장해주세요.'); return; }
  const subjArea = _xsubResolvedSubjectArea(_xsubCurrent);
  const summary = XSUB_REPORT_FIELDS.map(function(pair){ return _xsubCurrent.report[pair[0]]||''; }).join(' ');
  _xsubRecordLoading = true; render();
  try{
    const r = await window._fb.xlabGenerateSubjectRecord({
      department: _xsubCurrent.department||'',
      subjectArea: subjArea,
      topic: _xsubCurrent.topicTitle,
      topicDesc: _xsubCurrent.topicDesc||'',
      reportSummary: summary.slice(0,2000),
      grade: CU.grade||'',
    });
    _xsubCurrent.expectedRecord = {recordText:r.recordText, subject:subjArea, generatedAt:Date.now()};
    if(FB()) await window._fb.set('xlabSubjectReports', _xsubCurrent.id, _xsubCurrent);
    toast('교과 예상세특이 생성·저장되었습니다 💾');
  }catch(e){
    alert('생성 중 오류가 발생했습니다: '+e.message);
  }
  _xsubRecordLoading = false; render();
}

function _xsubBuildFullReportHtml(t){
  const savedDate = (t.report && t.report.savedAt) ? new Date(t.report.savedAt) : new Date();
  const dateStr = savedDate.getFullYear()+'.'+String(savedDate.getMonth()+1).padStart(2,'0')+'.'+String(savedDate.getDate()).padStart(2,'0');
  const schoolVal = t.studentSchool || (typeof CU!=='undefined' && CU ? CU.school : '') || '';
  const gradeVal = t.studentGrade || (typeof CU!=='undefined' && CU ? CU.grade : '') || '';
  const dateCompact = savedDate.getFullYear()+String(savedDate.getMonth()+1).padStart(2,'0')+String(savedDate.getDate()).padStart(2,'0');
  const pdfTitle = (t.studentName?(_xlabEsc(t.studentName)+'_'):'')+'X-lab 월별교과활동 보고서_'+dateCompact;
  const subjArea = _xsubResolvedSubjectArea(t);
  const reasonLine = _xsubReasonSummaryText(t.reason||{});
  const sections = [
    ['① 개념·원리·이론', t.report&&t.report.concept],
    ['② 실사례 예시', t.report&&t.report.example],
    ['③ 문제점·개선점', t.report&&t.report.issue],
    ['④ 배운점·느낀점·알게된점', t.report&&t.report.learned],
    ['⑤ 독서활동 기록', t.report&&t.report.reading],
    ['⑥ 심화·확장주제', t.report&&t.report.advanced],
  ];
  let html = '<html><head><meta charset="utf-8"><title>'+pdfTitle+'</title>'
    +'<style>body{font-family:"Malgun Gothic",sans-serif;padding:36px;color:#222;line-height:1.7}h1{font-size:22px;text-align:center;margin-bottom:14px}h2{font-size:15px;margin:20px 0 6px;color:#0f766e}hr{border:none;border-top:1px solid #ccc;margin:14px 0}.meta-row{display:flex;flex-wrap:wrap;gap:18px;font-size:13px}.topic-box{background:#f7f8fb;border-radius:10px;padding:12px 14px;font-size:13px}.record-box{background:#fff7ed;border-radius:10px;padding:12px 14px;font-size:13px;white-space:pre-wrap}p{font-size:13px;white-space:pre-wrap}</style></head><body>'
    +'<h1>📗 X-lab 월별교과활동 보고서</h1>'
    +'<hr>'
    +'<div class="meta-row">'
      +'<span>년월일: <b>'+dateStr+'</b></span>'
      +'<span>학교: <b>'+_xlabEsc(schoolVal)+'</b></span>'
      +'<span>학년: <b>'+_xlabEsc(gradeVal)+'</b></span>'
      +'<span>이름: <b>'+_xlabEsc(t.studentName)+'</b></span>'
      +'<span>희망학과: <b>'+_xlabEsc(t.department)+'</b></span>'
    +'</div>'
    +'<hr>'
    +'<div class="topic-box">'
      +'<div><b>교과목:</b> '+_xlabEsc(subjArea||'-')+'</div>'
      +'<div><b>탐구 주제:</b> '+_xlabEsc(t.topicTitle)+'</div>'
      +(t.topicDesc?('<div style="color:#666">'+_xlabEsc(t.topicDesc)+'</div>'):'')
      +'<div style="margin-top:6px"><b>주제 선정이유/계기:</b> '+_xlabEsc(reasonLine||'-')+'</div>'
    +'</div>'
    +'<hr>';
  sections.forEach(function(pair){
    html += '<h2>'+pair[0]+'</h2><p>'+_xlabEsc(pair[1])+'</p>';
  });
  if(t.expectedRecord && t.expectedRecord.recordText){
    html += '<hr><h2>📝 교과 예상 세특 ('+_xlabEsc(subjArea)+')</h2><div class="record-box">'+_xlabEsc(t.expectedRecord.recordText)+'</div>';
  }
  html += '<script>window.onload=function(){setTimeout(function(){window.print();},500);};<\/script></body></html>';
  return html;
}
