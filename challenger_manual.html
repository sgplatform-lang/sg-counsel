/* 챌린저 사용설명서 렌더링(공용: 앱 안 패널 + 웹 매뉴얼) */
function CH_E(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var CH_CSS='.ch{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:#1a2340;line-height:1.65;font-size:14px}'
+'.ch *{box-sizing:border-box}.ch h1{font-size:22px;margin:0 0 6px;letter-spacing:-.5px}.ch h2{font-size:18px;margin:0 0 4px;letter-spacing:-.4px}.ch h3{font-size:14.5px;margin:18px 0 6px;color:#115e59}'
+'.ch .ch_sub{color:#64748b;font-size:13px;margin:0 0 12px}.ch .ch_box{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:11px 14px;margin:10px 0;font-size:13.5px}'
+'.ch .ch_meta{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:13px}.ch .ch_meta b{color:#0f766e}'
+'.ch ol.ch_st{list-style:none;counter-reset:s;margin:6px 0;padding:0}.ch ol.ch_st>li{counter-increment:s;position:relative;padding:9px 12px 9px 46px;margin:7px 0;background:#fff;border:1px solid #e5e7eb;border-radius:12px;min-height:44px}'
+'.ch ol.ch_st>li:before{content:counter(s);position:absolute;left:11px;top:9px;width:25px;height:25px;border-radius:50%;background:#0f766e;color:#fff;font-weight:800;font-size:13px;text-align:center;line-height:25px}'
+'.ch ol.ch_st>li b.ch_t{display:block;color:#1a2340;margin-bottom:1px}.ch .ch_res{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}'
+'.ch ul.ch_tp{margin:4px 0 0;padding-left:20px;font-size:13px;color:#475569}.ch .ch_warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0;color:#9a3412}'
+'.ch .ch_note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;font-size:12.5px;margin:8px 0;color:#92400e}.ch .ch_sec{margin-bottom:26px;padding-bottom:6px}'
+'.ch .ch_q{font-weight:800;margin-top:12px}.ch .ch_a{color:#475569;margin:2px 0 0}.ch .ch_ic{font-size:20px;margin-right:6px}.ch .ch_hr{border:0;border-top:1px dashed #99f6e4;margin:18px 0}'
+'@media print{.ch .ch_sec{page-break-inside:avoid;break-inside:avoid-page}.ch ol.ch_st>li{break-inside:avoid}.ch_noprint{display:none!important}}';
function CH_steps(a){ return '<ol class="ch_st">'+a.map(function(x){ return typeof x==='string'?'<li>'+CH_E(x)+'</li>':'<li><b class="ch_t">'+CH_E(x.t)+'</b>'+CH_E(x.d)+'</li>'; }).join('')+'</ol>'; }
function CH_tips(a,lab){ return (a&&a.length)?'<div class="ch_note"><b>'+(lab||'알아 두면 좋아요')+'</b><ul class="ch_tp">'+a.map(function(t){ return '<li>'+CH_E(t)+'</li>'; }).join('')+'</ul></div>':''; }
function CH_startHtml(){ var s=CH_DOC.start; return '<section class="ch_sec" id="ch_start"><h2><span class="ch_ic">🚀</span>'+CH_E(s.title)+'</h2><p class="ch_sub">'+CH_E(s.sub)+'</p>'+CH_steps(s.steps)+CH_tips(s.tips,'처음 쓰시는 분께')+'</section>'; }
function CH_pageHtml(p,onlySub){
  var subs=onlySub!=null?p.subs.filter(function(x){ return x.k===onlySub; }):p.subs; if(!subs.length) subs=p.subs;
  var h='<section class="ch_sec" id="ch_'+p.key+'"><h2><span class="ch_ic">'+p.icon+'</span>'+CH_E(p.title)+'</h2><p class="ch_sub">'+CH_E(p.what)+'</p>'
   +'<div class="ch_meta"><b>누가</b><span>'+CH_E(p.who)+'</span><b>언제</b><span>'+CH_E(p.when)+'</span></div>'+(p.notice?'<div class="ch_warn">'+CH_E(p.notice)+'</div>':'');
  subs.forEach(function(x){ h+=(p.subs.length>1||x.t!=='사용 방법'?'<h3>'+CH_E(x.t)+'</h3>':'<h3>사용 방법</h3>')+CH_steps(x.steps)+'<div class="ch_res"><b>결과</b> · '+CH_E(x.result)+'</div>'+CH_tips(x.tips); });
  if(onlySub!=null&&p.subs.length>1) h+='<p class="ch_sub ch_noprint">이 탭의 다른 하위 화면 설명은 아래 「전체 목차」에서 볼 수 있어요.</p>';
  if(p.mistakes&&p.mistakes.length) h+=CH_tips(p.mistakes,'자주 하는 실수');
  return h+'</section>'; }
function CH_faqHtml(){ return '<section class="ch_sec" id="ch_faq"><h2><span class="ch_ic">💬</span>자주 묻는 질문</h2>'+CH_DOC.faq.map(function(f){ return '<div class="ch_q">Q. '+CH_E(f.q)+'</div><div class="ch_a">'+CH_E(f.a)+'</div>'; }).join('')+'</section>'; }
function CH_mapHtml(){ return '<section class="ch_sec" id="ch_map"><h2><span class="ch_ic">🗺</span>챌린저 한눈에 보기</h2><p class="ch_sub">위쪽 버튼 3개, 기본 화면 탭 3개, 부가기능 7개로 이루어져 있습니다.</p>'
  +CH_DOC.groups.map(function(g){ return '<h3>'+CH_E(g.title)+' <span style="font-weight:600;color:#64748b;font-size:12px">'+CH_E(g.sub)+'</span></h3><div class="ch_box">'+CH_DOC.pages.filter(function(p){ return p.grp===g.key; }).map(function(p){ return '<div style="margin:4px 0">'+p.icon+' <b>'+CH_E(p.title)+'</b> — '+CH_E(p.what)+'</div>'; }).join('')+'</div>'; }).join('')+'</section>'; }
function CH_allHtml(){ return '<div class="ch"><h1>'+CH_E(CH_DOC.title)+'</h1><p class="ch_sub">'+CH_E(CH_DOC.intro)+' <span style="color:#94a3b8">('+CH_E(CH_DOC.ver)+')</span></p>'+CH_startHtml()+CH_mapHtml()+CH_DOC.pages.map(function(p){ return CH_pageHtml(p); }).join('')+CH_faqHtml()+'</div>'; }

document.getElementById('ch_css').textContent=CH_CSS;
var side='<a href="#ch_start">🚀 처음 30분 가이드</a><a href="#ch_map">🗺 챌린저 한눈에 보기</a>'+CH_DOC.groups.map(function(g){return '<div class="g">'+CH_E(g.title)+'</div>'+CH_DOC.pages.filter(function(p){return p.grp===g.key;}).map(function(p){return '<a href="#ch_'+p.key+'">'+p.icon+' '+CH_E(p.title)+'</a>';}).join('');}).join('')+'<a href="#ch_faq">💬 자주 묻는 질문</a>';
document.getElementById('xm_side').innerHTML=side;
document.getElementById('xm_content').innerHTML=CH_allHtml();
</script></body></html>
