<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결과리포트</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
<style>
  :root{--brand:#0f766e;--ink:#172033;--muted:#667085;--line:#d8e2ee;--bg:#f6f9fc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Noto Sans KR',sans-serif;line-height:1.5}
  .sg-share-topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .sg-share-topbar .meta{font-size:12.5px;color:var(--muted)}
  .sg-share-topbar .meta b{color:var(--ink)}
  .sg-share-print-btn{border:0;border-radius:9px;padding:8px 14px;font-weight:700;background:var(--brand);color:#fff;cursor:pointer;font-size:12.5px}
  .sg-share-wrap{max-width:900px;margin:0 auto;padding:16px 16px 60px}
  .sg-share-state{max-width:520px;margin:80px auto;text-align:center;padding:0 20px;color:var(--muted);font-size:14px;line-height:1.8;white-space:pre-line}
  .sg-share-state b{color:var(--ink);display:block;font-size:17px;margin-bottom:8px}
  @media print{ .sg-share-topbar{display:none} }
</style>
</head>
<body>
<div id="sgShareState" class="sg-share-state">불러오는 중입니다...</div>
<div id="sgShareRoot" style="display:none">
  <div class="sg-share-topbar no-print">
    <div class="meta">👤 <b id="sgShareStudentName" style="display:inline"></b> · <span id="sgShareTestMeta"></span></div>
    <button class="sg-share-print-btn" onclick="window.print()">인쇄 / PDF 저장</button>
  </div>
  <div class="sg-share-wrap" id="sgShareBody"></div>
</div>
<script>
// ── Firebase 초기화 (관리자 앱과 동일 프로젝트, 사전상담설문지_웹폼.html과 동일 패턴) ──
// 이 페이지는 읽기 전용(reportShares 컬렉션에서 token으로 문서 1건만 조회)이라
// 별도 제출 로직은 없다. 초기화 실패 시에도 안내 문구는 보여줄 수 있게 감싼다.
let _db=null;
const SG_RECAPTCHA_SITE_KEY = '6LcoRrEtAAAAAG2W-Q8g-rhXW7j53hB6peh2DOFZ';
try{
  firebase.initializeApp({
    apiKey: "AIzaSyBzE9aGv1vtZWv7FKntPA9r_r_52HhV6Kg",
    authDomain: "sg-counsel.firebaseapp.com",
    projectId: "sg-counsel",
    storageBucket: "sg-counsel.firebasestorage.app",
    messagingSenderId: "134794459070",
    appId: "1:134794459070:web:a636cac4df344bd26e2bef"
  });
  function _sgActivateAppCheck(){
    try{
      if(SG_RECAPTCHA_SITE_KEY && SG_RECAPTCHA_SITE_KEY.indexOf('PASTE_YOUR')!==0){
        firebase.appCheck().activate(
          new firebase.appCheck.ReCaptchaEnterpriseProvider(SG_RECAPTCHA_SITE_KEY),
          true
        );
      } else {
        console.warn('⚠️ App Check 사이트 키가 아직 설정되지 않았습니다.');
      }
    }catch(e){ console.warn('App Check 활성화 실패(무시하고 진행):', e.message); }
  }
  if(document.body){ _sgActivateAppCheck(); }
  else { document.addEventListener('DOMContentLoaded', _sgActivateAppCheck); }
  _db = firebase.firestore();
  _db.settings({ experimentalAutoDetectLongPolling: true });
}catch(e){
  console.warn('Firebase 초기화 실패:', e.message);
}

function $(id){ return document.getElementById(id); }
function showState(text){
  $('sgShareState').textContent=text;
  $('sgShareState').style.display='block';
  $('sgShareRoot').style.display='none';
}

// ★ 성공 시 실제 DOM 반영 로직을 별도 함수로 분리 — 자동화 테스트에서 실제 Firestore 없이
// 이 함수만 직접 호출해 렌더링 결과를 검증할 수 있도록 window에 노출해둔다.
window.__sgRenderShareDoc = function(d){
  d = d || {};
  // ★ 발행 시점에 캡처된 <style> 태그들을 이 페이지 head에 그대로 삽입해, 관리자
  // 결과리포트와 동일한 디자인으로 렌더링되게 한다(인쇄/PDF 팝업과 동일한 기법).
  const styleHolder=document.createElement('div');
  styleHolder.innerHTML=d.styleHtml||'';
  Array.from(styleHolder.children).forEach(function(el){ document.head.appendChild(el); });
  $('sgShareBody').innerHTML=d.bodyHtml||'';
  $('sgShareStudentName').textContent=d.studentName||'학생';
  const metaParts=[d.testName, d.testDate].filter(Boolean);
  $('sgShareTestMeta').textContent=metaParts.join(' · ') || '결과리포트';
  document.title=(d.studentName||'학생')+' 결과리포트';
  $('sgShareState').style.display='none';
  $('sgShareRoot').style.display='block';
};

const token=(new URLSearchParams(location.search)).get('token')||'';

if(!token){
  showState('잘못된 링크입니다.\n링크 주소를 다시 확인해주세요.');
}else if(!_db){
  showState('페이지를 불러오지 못했습니다.\n인터넷 연결을 확인한 뒤 새로고침해주세요.');
}else{
  _db.collection('reportShares').doc(token).get().then(function(doc){
    if(!doc.exists || doc.data().revoked){
      showState('링크를 찾을 수 없습니다.\n링크가 만료되었거나 잘못된 주소일 수 있습니다.\n담당 선생님께 새 링크를 요청해주세요.');
      return;
    }
    window.__sgRenderShareDoc(doc.data());
  }).catch(function(e){
    console.warn('리포트 조회 실패', e);
    showState('리포트를 불러오는 중 오류가 발생했습니다.\n잠시 후 다시 시도해주세요.');
  });
}
</script>
</body>
</html>
