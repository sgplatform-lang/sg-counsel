    {k:'list',t:'학생별 현황',steps:['「🎯 X-lab_AAR → 📋 학생별 현황」을 엽니다.','표에서 입력일, 구분, 주제명, AAR 입력 유무를 봅니다. 「있음 N회」는 학생이 AAR을 쓴 횟수이고, 「없음」은 아직 쓰지 않은 것입니다.','⚠️ 표시가 붙은 줄은 우선 확인이 필요한 신호가 있는 건입니다. 먼저 눌러 보세요.','상세에서 「우선 확인이 필요한 신호」, 보고서·기록 내용, 입력 이력을 읽습니다.','맨 아래 교사 검토(확인·상담·행동 변경·작업물 확인)를 선택하고 저장합니다. 「저장 실패」가 나오면 인터넷 연결을 확인하고 다시 저장하세요.'],result:'학생이 스스로 점검한 내용과 교사 검토 기록',tips:['⚠️ 줄부터 보면 상담 우선순위를 빨리 정할 수 있습니다.','학생이 AAR을 쓰기 전이라면 표에서 「없음」으로만 보입니다.']},
    {k:'cards',t:'카드관리 (개념·자료)',steps:['「🗂 카드관리(개념·자료)」를 엽니다.','여기서 등록한 카드는 모든 학생의 AAR 「교과 심화하기」 단계에 함께 보입니다. 개념 카드와 유형별 자료 카드는 각각 학생에게 최대 5개까지 노출됩니다.','「개념 카드 추가」로 교과 개념과 설명을 등록합니다. 파일(교과서 목차·성취기준·수업자료 등)로 후보를 자동으로 채우는 기능도 있습니다.','「자료 카드 추가」로 저자·기관, 자료 종류, 서지정보, 확인 날짜, 연결할 교과 개념을 입력합니다.','수정은 카드를 눌러 하고, 필요 없으면 삭제합니다.'],result:'모든 학생에게 공통으로 보이는 학습 카드',tips:['카드는 전체 학생에게 보이니 내용을 한 번 더 확인하고 저장하세요.']}

   subs:[
    {k:'db',t:'🏛 대학 기출DB',steps:['「📚 수업자료 → 🏛 대학 기출DB」를 엽니다.','처음에는 「📥 기본 20개 대학 기출 가져오기」를 한 번 누릅니다. 이후에는 「기본 20개 중 없는 대학 추가」로 빠진 곳만 채웁니다.','대학·특목·자사를 직접 넣으려면 「＋ 기관 직접 추가」를, 기출 PDF나 문서가 있으면 「📄 기출 PDF·문서로 추가」를 씁니다.','검색창에 대학명·질문 내용을 넣거나 면접유형·유형 필터로 좁혀 봅니다.','대학 한 곳을 열면 면접 시간, 선발방법, 평가방법, 면접 형식, 유의사항과 기출 문항이 나옵니다. 「문항 추가」로 기출을 더하고 「이 대학 인쇄·PDF」로 출력합니다.','제시문 기출이 필요하면 「📖 제시문 기출·면접방식 갱신(2026 자료집)」을 눌러 반영합니다.'],result:'수업에서 쓸 대학 기출 자료 창고',tips:['「이 학생 6칸 대학만」은 학생이 모의수시지원서에 대학을 입력해야 켤 수 있습니다.','잘못 등록한 대학은 상세 화면의 「대학 삭제」로 지웁니다. 지우면 되돌릴 수 없습니다.']},
    {k:'curri',t:'🗓 수업 커리큘럼',steps:['「🗓 수업 커리큘럼」을 엽니다.','주차마다 단계, 수업명, 수업 활동, 중점 기출 유형(자동 배정 기준)을 적습니다. 「주차 추가」로 늘리고 「기본값으로 되돌리기」로 처음 상태로 돌립니다.','학생에게 보이게 하려면 주차의 「공개」를 켜고 시작일을 정합니다. 시작일을 넣으면 그 날짜부터 자동 공개됩니다.','주차별 「공개 반」에서 어느 반에 보일지 고릅니다.','마지막에 반드시 「커리큘럼 저장」을 누릅니다.','「수업 커리큘럼 인쇄·PDF」와 「전체 빈 워크북 인쇄·PDF」로 출력할 수 있습니다.'],result:'학생 화면 수업 탭에 주차가 나타납니다.',tips:['공개 반을 정하지 않으면 학생 화면에 주차가 나타나지 않을 수 있습니다.','수정한 뒤 저장을 잊으면 내용이 사라집니다.']},
    {k:'wb',t:'📓 워크북 배정·열람',steps:['「📓 워크북 배정·열람」을 엽니다. 「이 학생의 반에 공개된 주차가 없습니다」가 나오면 먼저 커리큘럼에서 그 반에 주차를 공개하세요.','주차를 고릅니다.','「오늘의 서류기반 기출연습 2문항 배정」에서 「칸 대학·이번 주 유형으로 자동 2문항」을 누르거나 「직접 고르기」로 문항을 정합니다. 학생에게는 배정한 문항만 보입니다.','학생이 워크북을 쓰면 「학생 작성본」에 나타납니다. 읽고 「교사 코멘트」에 1~2줄, 가능하면 질문 형태로 적은 뒤 「코멘트 저장」을 누릅니다.','「빈 워크북(배정 기출 포함)」을 인쇄해 수업에 쓸 수 있습니다. 배정을 바꾸려면 「배정 비우기」를 누릅니다.'],result:'학생별 오늘의 기출 2문항과 코멘트',tips:['코멘트는 답을 알려 주기보다 생각을 넓히는 질문 한 줄이 효과적입니다.','「저장했습니다」가 보이면 저장이 끝난 것입니다.']},
    {k:'files',t:'📎 워크북 파일·인쇄',steps:['「📎 워크북 파일·인쇄」를 엽니다.','직접 만든 워크북 파일(docx·pdf·hwp·이미지 등)의 제목을 적고 공통 또는 주차를 고른 뒤 파일을 올립니다.','학생에게 내려받게 하려면 「학생에게 공개」를 켭니다.','올린 목록에서 「원본 받기」나 「인쇄·PDF 저장」을 누릅니다.'],result:'수업에서 쓸 워크북 파일 보관함',tips:['docx는 올릴 때 인쇄용으로 자동 변환되고, pdf와 이미지는 바로 인쇄됩니다. hwp는 원본 받기만 되니 PDF로 저장해서 올려 주세요.','일부 docx는 변환이 실패할 수 있습니다. 원본은 올라가 있으니 PDF로 다시 올리면 됩니다.','삭제하면 학생 화면에서도 사라집니다.']},
    {k:'pass',t:'📖 제시문 배정·현황',steps:['「📖 제시문 배정·현황」을 엽니다. 제시문 기출이 등록된 대학이 없다고 나오면 「대학 기출DB」에서 「제시문 기출·면접방식 갱신」을 먼저 실행하세요.','「학생 배정·풀이」에서 대학과 제시문 세트를 고르고 필요하면 다른 학생도 함께 선택한 뒤 「선택한 제시문 배정하기」를 누릅니다. 이미 배정된 세트는 풀이를 유지하고 건너뜁니다.','학생에게는 제시문·문제·그림만 보이고 출제 의도와 예시 답안은 보이지 않습니다.','학생이 푼 내용(한 줄 요약, 구조, 말하기 답변, 꼬리질문 대답 등)을 열어 읽고 「선생님 코멘트」를 저장합니다.','교실 화면(빔·TV)에는 「송출 창 열기」로 새 창을 띄운 뒤 원하는 답변의 「📺 송출」을 누릅니다. 학생 이름 표시는 켜고 끌 수 있습니다.','「전체 학생 현황」에서는 모든 학생의 배정·풀이 진행을 한 표로 봅니다.'],result:'학생별 제시문 풀이와 수업 송출',tips:['배정을 취소하면 학생이 쓴 풀이도 함께 삭제됩니다. 신중히 누르세요.','배정 실패 메시지가 나오면 관리자에게 알려 데이터베이스 권한 설정을 확인받아야 합니다.']},
    {k:'recq',t:'🧾 생기부 면접질문',steps:['「🧾 생기부 면접질문」을 엽니다. 두 가지 방식이 있습니다.','「학생 워크북에서 불러오기」: 학생이 쓴 월별주제·교과활동, 최종예상세특, 셀프활동을 불러옵니다. 「필수 질문 한꺼번에 만들기」를 누르면 동기·과정·근거·한계 질문이 만들어지고, 그 밖의 질문은 각 활동 아래 「질문 1개 더」로 유형과 초점을 골라 추가합니다.','「생기부 원문 붙여넣기」: 학생 생기부 원문을 붙여 넣습니다. 이름·학교명 등은 자동으로 가려져 전송되며 「가림 결과」로 미리 볼 수 있고, 가릴 단어를 더 적을 수 있습니다.','희망 학과·진로를 입력하고 「생성하기」를 눌러 질문을 만듭니다. 유형을 골라 그 유형만 다시 만들 수도 있습니다.','질문은 직접 추가·수정할 수 있고 「송출 창 열기」로 교실 화면에 띄울 수 있습니다. 「인쇄·PDF」「전체 복사」도 가능합니다.'],result:'학생 생기부를 바탕으로 한 면접 예상 질문',tips:['학생 화면에는 나오지 않는 선생님용 도구입니다.','다시 만들면 해당 유형의 기존 질문이 새 질문으로 바뀝니다. 직접 쓴 질문은 「질문 추가」로 따로 넣어 두세요.','생성에는 시간이 걸립니다. 「생성 중」이 끝날 때까지 기다리세요.']},
    {k:'grade',t:'🎓 학점·평가',steps:['「🎓 학점·평가」를 엽니다. 학생이 작성한 활동이나 수행평가 파일이 아직 없으면 평가할 것이 없다고 안내됩니다.','평가할 학생의 항목을 열어 항목별 점수 버튼을 고릅니다. 「🤖 AI 점수 제안(최고 A)」을 누르면 참고용 점수를 받을 수 있지만, 최종 점수는 선생님이 정합니다. 1~3분 걸릴 수 있습니다.','A+는 95점 이상이면서 선생님 승인(사유 필수)일 때만 부여됩니다. A+를 주려면 「A+ 부여 사유」를 반드시 적으세요.','학생에게 보여줄 총평을 쓰고 「💾 평가 저장」을 누릅니다. 이 단계까지는 관리자만 볼 수 있습니다.','학생에게 보이려면 「👁 학생에게 공개」를 누릅니다. 취소는 「🙈 공개 취소」입니다. 목록에서는 「전체 공개」「전체 비공개」로 한꺼번에 바꿀 수도 있습니다. 잘못 만든 평가는 「🗑 평가 삭제」로 지웁니다.','「🖨 학점표 인쇄/PDF」로 출력합니다. 목록 위쪽에는 평점평균, 평균 점수, 평가 완료 건수, 학생 공개 건수가 요약됩니다.'],result:'학생별 월 평점과 학점표',tips:['전체 평가가 10건 이상일 때 A+ 비율이 권장 상한을 넘으면 경고가 나옵니다. 기준을 다시 점검하세요.','공개 버튼을 누르기 전에는 학생이 결과를 볼 수 없습니다.']}
   ],
   mistakes:['커리큘럼을 고치고 「커리큘럼 저장」을 누르지 않아 변경이 사라지는 경우','주차를 공개하지 않아 학생 화면에 수업이 안 나타나는 경우 — 공개와 공개 반을 함께 확인하세요.']},
  {key:'xperf', grp:'run', icon:'📌', title:'수행평가·파일', mode:'xperf',
   what:'학생의 수행평가 일정을 관리하고, 학생이 올린 수행평가 파일에 질문 중심 첨삭을 돌려주는 곳입니다.',
   who:'학생이 일정과 파일을 올리고 선생님이 확인·첨삭합니다.',
   when:'수업 시작 때 수행평가 일정 점검, 수행평가 초안 첨삭',
   subs:[
    {k:'tracker',t:'📌 수행평가 트래커',steps:['「📌 수행평가·파일 → 📌 수행평가 트래커」를 엽니다.','과목·수행평가명, 일정, 유형, 배점이 목록으로 보입니다. 학기 2주차까지 학생이 일정·유형·배점을 올립니다. 선생님은 「수행평가 추가」로 직접 넣을 수도 있습니다.','수업 0~10분에 「화면 공유 모드」를 눌러 화면에 띄웁니다. 「이 학생」 또는 「전체 학생 D-21」 중 고릅니다.','D-21 이내 수행평가를 같이 확인하고, D-7 학생은 그날 초안 점검을 받게 합니다.'],result:'다가오는 수행평가 일정 한눈에',tips:['등록된 수행평가가 없다고 나오면 학생이 아직 일정을 올리지 않은 것입니다.']},
    {k:'files',t:'📁 파일함·AI 첨삭',steps:['「📁 파일함·AI 첨삭」을 엽니다. 이름 옆 숫자는 아직 처리하지 않은 파일 수입니다.','학생이 올린 파일 목록에서 하나를 엽니다. 파일명 규칙은 「학생명_과목_수행평가명_v1_학생」입니다. 학생이 못 올렸다면 「학생 대신 파일 올리기」로 올릴 수 있습니다.','파일 종류(수행평가 보고서, 발표·토론 자료, 실험 설계, 예상세특)와 희망 학과를 확인합니다. 학교의 평가기준이 있으면 입력해 두면 그 기준으로 점검합니다.','「첨삭 초안 만들기」를 누릅니다. 첨삭은 문장을 고쳐 써 주지 않고 원문 인용 + 기호 + 질문만 만듭니다. 만들어진 초안은 학생에게 보이지 않습니다.','첨삭 항목을 검토합니다. 「원문 확인 안 됨」이 붙은 항목은 원문에서 문장을 찾지 못한 것이니 수정하거나 제외하고, 항목마다 「공유에 포함」을 고릅니다. 「직접 추가」로 항목을 더할 수 있습니다.','필요하면 전체 코멘트 1~2줄과 주석 단 파일(PDF·문서 등)을 첨부합니다. 「초안 저장」으로 저장합니다.','검토가 끝나면 「검토 완료·학생에게 공유」를 누릅니다. 공유한 뒤에도 「공유 취소」나 「수정본 다시 공유」가 가능합니다. 학생이 「반영했어요」를 누르면 알림으로 보입니다.'],result:'학생이 질문만 받아 스스로 고쳐 쓰는 첨삭',tips:['공유 전 초안은 학생에게 보이지 않으니 편하게 고치셔도 됩니다.','학생 원문은 항상 학생이 쓴 그대로 남습니다.']}
   ],
   mistakes:['초안을 만든 뒤 「공유」를 누르지 않아 학생이 첨삭을 못 보는 경우']}
 ],
 faq:[

  {q:'인쇄 창이 안 열려요.',a:'브라우저의 팝업 차단을 풀어 주세요. 주소창 오른쪽에 팝업 차단 표시가 뜹니다.'},
  {q:'학생이 쓴 내용을 선생님이 고칠 수 있나요?',a:'대부분의 X-lab 화면은 확인·인쇄용입니다. 수정이 필요하면 학생에게 학생용 페이지에서 고치도록 안내하세요.'}
 ]

/* X-lab 사용설명서 렌더링(공용: 앱 안 패널 + 웹 매뉴얼) */
function XH_E(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var XH_CSS='.xh{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:#1a2340;line-height:1.65;font-size:14px}'
+'.xh *{box-sizing:border-box}.xh h1{font-size:22px;margin:0 0 6px;letter-spacing:-.5px}.xh h2{font-size:18px;margin:0 0 4px;letter-spacing:-.4px}.xh h3{font-size:14.5px;margin:18px 0 6px;color:#5b21b6}'
+'.xh .xh_sub{color:#64748b;font-size:13px;margin:0 0 12px}.xh .xh_box{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:12px;padding:11px 14px;margin:10px 0;font-size:13.5px}'
+'.xh .xh_meta{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:13px}.xh .xh_meta b{color:#7c3aed}'
+'.xh ol.xh_st{list-style:none;counter-reset:s;margin:6px 0;padding:0}.xh ol.xh_st>li{counter-increment:s;position:relative;padding:9px 12px 9px 46px;margin:7px 0;background:#fff;border:1px solid #e5e7eb;border-radius:12px;min-height:44px}'
+'.xh ol.xh_st>li:before{content:counter(s);position:absolute;left:11px;top:9px;width:25px;height:25px;border-radius:50%;background:#7c3aed;color:#fff;font-weight:800;font-size:13px;text-align:center;line-height:25px}'
+'.xh ol.xh_st>li b.xh_t{display:block;color:#1a2340;margin-bottom:1px}.xh .xh_res{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}'
+'.xh ul.xh_tp{margin:4px 0 0;padding-left:20px;font-size:13px;color:#475569}.xh .xh_warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0;color:#9a3412}'
+'.xh .xh_note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;font-size:12.5px;margin:8px 0;color:#92400e}.xh .xh_sec{margin-bottom:26px;padding-bottom:6px}'
+'.xh .xh_q{font-weight:800;margin-top:12px}.xh .xh_a{color:#475569;margin:2px 0 0}.xh .xh_ic{font-size:20px;margin-right:6px}.xh .xh_hr{border:0;border-top:1px dashed #ddd6fe;margin:18px 0}'
+'@media print{.xh .xh_sec{page-break-inside:avoid;break-inside:avoid-page}.xh ol.xh_st>li{break-inside:avoid}.xh_noprint{display:none!important}}';
function XH_steps(a){ return '<ol class="xh_st">'+a.map(function(x){ return typeof x==='string'?'<li>'+XH_E(x)+'</li>':'<li><b class="xh_t">'+XH_E(x.t)+'</b>'+XH_E(x.d)+'</li>'; }).join('')+'</ol>'; }
function XH_tips(a,lab){ return (a&&a.length)?'<div class="xh_note"><b>'+(lab||'알아 두면 좋아요')+'</b><ul class="xh_tp">'+a.map(function(t){ return '<li>'+XH_E(t)+'</li>'; }).join('')+'</ul></div>':''; }
function XH_startHtml(){ var s=XH_DOC.start; return '<section class="xh_sec" id="xh_start"><h2><span class="xh_ic">🚀</span>'+XH_E(s.title)+'</h2><p class="xh_sub">'+XH_E(s.sub)+'</p>'+XH_steps(s.steps)+XH_tips(s.tips,'처음 쓰시는 분께')+'</section>'; }
function XH_pageHtml(p,onlySub){
  var subs=onlySub!=null?p.subs.filter(function(x){ return x.k===onlySub; }):p.subs; if(!subs.length) subs=p.subs;
  var h='<section class="xh_sec" id="xh_'+p.key+'"><h2><span class="xh_ic">'+p.icon+'</span>'+XH_E(p.title)+'</h2><p class="xh_sub">'+XH_E(p.what)+'</p>'
   +'<div class="xh_meta"><b>누가</b><span>'+XH_E(p.who)+'</span><b>언제</b><span>'+XH_E(p.when)+'</span></div>'+(p.notice?'<div class="xh_warn">'+XH_E(p.notice)+'</div>':'');
  subs.forEach(function(x){ h+=(p.subs.length>1||x.t!=='사용 방법'?'<h3>'+XH_E(x.t)+'</h3>':'<h3>사용 방법</h3>')+XH_steps(x.steps)+'<div class="xh_res"><b>결과</b> · '+XH_E(x.result)+'</div>'+XH_tips(x.tips); });
  if(onlySub!=null&&p.subs.length>1) h+='<p class="xh_sub xh_noprint">이 탭의 다른 하위 화면 설명은 아래 「전체 목차」에서 볼 수 있어요.</p>';
  if(p.mistakes&&p.mistakes.length) h+=XH_tips(p.mistakes,'자주 하는 실수');
  return h+'</section>'; }
function XH_faqHtml(){ return '<section class="xh_sec" id="xh_faq"><h2><span class="xh_ic">💬</span>자주 묻는 질문</h2>'+XH_DOC.faq.map(function(f){ return '<div class="xh_q">Q. '+XH_E(f.q)+'</div><div class="xh_a">'+XH_E(f.a)+'</div>'; }).join('')+'</section>'; }
function XH_mapHtml(){ return '<section class="xh_sec" id="xh_map"><h2><span class="xh_ic">🗺</span>X-lab 한눈에 보기</h2><p class="xh_sub">상위 탭은 모두 9개입니다. 학생을 선택한 뒤 X-lab 탭에서 아래 순서로 만나게 됩니다.</p>'
  +XH_DOC.groups.map(function(g){ return '<h3>'+XH_E(g.title)+' <span style="font-weight:600;color:#64748b;font-size:12px">'+XH_E(g.sub)+'</span></h3><div class="xh_box">'+XH_DOC.pages.filter(function(p){ return p.grp===g.key; }).map(function(p){ return '<div style="margin:4px 0">'+p.icon+' <b>'+XH_E(p.title)+'</b> — '+XH_E(p.what)+'</div>'; }).join('')+'</div>'; }).join('')+'</section>'; }
function XH_allHtml(){ return '<div class="xh"><h1>'+XH_E(XH_DOC.title)+'</h1><p class="xh_sub">'+XH_E(XH_DOC.intro)+' <span style="color:#94a3b8">('+XH_E(XH_DOC.ver)+')</span></p>'+XH_startHtml()+XH_mapHtml()+XH_DOC.pages.map(function(p){ return XH_pageHtml(p); }).join('')+XH_faqHtml()+'</div>'; }

document.getElementById('xh_css').textContent=XH_CSS;
var side='<a href="#xh_start">🚀 처음 30분 가이드</a><a href="#xh_map">🗺 X-lab 한눈에 보기</a>'+XH_DOC.groups.map(function(g){return '<div class="g">'+XH_E(g.title)+'</div>'+XH_DOC.pages.filter(function(p){return p.grp===g.key;}).map(function(p){return '<a href="#xh_'+p.key+'">'+p.icon+' '+XH_E(p.title)+'</a>';}).join('');}).join('')+'<a href="#xh_faq">💬 자주 묻는 질문</a>';
document.getElementById('xm_side').innerHTML=side;
document.getElementById('xm_content').innerHTML=XH_allHtml();
</script></body></html>
